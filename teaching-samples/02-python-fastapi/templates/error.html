{% extends "layout.html" %}

{% block title %}{{ title }}{% endblock %}

{% block content %}
<h1>{{ title }}</h1>

<div class="alert alert-danger">
    <ul class="mb-0">
        {% for problem in problems %}
        <li>{{ problem }}</li>
        {% endfor %}
    </ul>
</div>

<a href="javascript:history.back()">Go back</a>
{% endblock %}
