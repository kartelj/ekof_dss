<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Index of {{ path }}</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            margin: 2em;
            color: #333;
        }

        h1 {
            font-size: 1.4em;
            color: #369;
        }

        ul {
            list-style-type: none;
            padding: 0;
        }

        li {
            padding: .35em .5em;
            border-bottom: 1px solid #eee;
        }

        li:hover {
            background-color: #f5f5f5;
        }

        a {
            color: #333;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        .folder a {
            font-weight: bold;
            color: #369;
        }
    </style>
</head>

<body>
    <h1>Index of {{ path }}</h1>

    <ul>
        {% if not is_root %}
        <li class="folder"><a href="../">&#128193; ..</a></li>
        {% endif %}
        {% for name in folders %}
        <li class="folder"><a href="{{ name | urlencode }}/">&#128193; {{ name }}/</a></li>
        {% endfor %}
        {% for name in files %}
        <li><a href="{{ name | urlencode }}">&#128196; {{ name }}</a></li>
        {% endfor %}
    </ul>
</body>

</html>
