<body>

    <h2>Nested list</h2>

    <ol>
        <li>Coffee</li>
        <li>Tea
            <ol>
                <li>Black tea</li>
                <li>Green tea
                    <ul>
                        <li>China</li>
                        <li>Ceylon</li>
                    </ul>
                </li>
            </ol>
        </li>
        <li>Milk</li>
    </ol>

</body>
