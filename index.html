<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Developing Software Solutions</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <style>
        h1,
        h2,
        h3 {
            color: #9b1c31;
        }

        h2 {
            font-size: 1.5rem;
            margin-top: 2rem;
        }

        h3 {
            font-size: 1.2rem;
            margin-top: 1.5rem;
        }

        table {
            margin-bottom: 1rem;
        }

        th,
        td {
            border: 1px solid #dee2e6;
            padding: .3rem .6rem;
        }

        pre {
            background-color: #f1f1f1;
            padding: .6rem 1rem;
        }
    </style>
</head>

<body>
    <!--
        The course page for the web (GitHub Pages, or python -m http.server in this folder).
        The text is index.md, the same file that GitHub shows; here a lecture opens as slides,
        and the samples open on GitHub.
    -->
    <div class="container my-4" id="course">
        <p>Loading the course page ... (if it does not appear, read it on
            <a href="https://github.com/kartelj/ekof_dss/blob/main/index.md">GitHub</a>)</p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
    <script>
        const REPOSITORY = "https://github.com/kartelj/ekof_dss/";

        fetch("index.md")
            .then(response => response.text())
            .then(text => {
                const course = document.getElementById("course");
                course.innerHTML = marked.parse(text);
                for (const link of course.querySelectorAll("a[href]")) {
                    const address = link.getAttribute("href");
                    if (/^[a-z]+:/i.test(address) || address.startsWith("#")) {
                        continue;  // addresses of other sites stay as they are
                    }
                    // a lecture opens as slides; everything else (samples, README, LICENSE) on GitHub
                    const lecture = address.match(/^presentations\/([\w-]+)\.md$/);
                    if (lecture) {
                        link.href = "presentations/slides.html?deck=" + lecture[1];
                    } else {
                        link.href = REPOSITORY + (address.endsWith("/") ? "tree/main/" : "blob/main/") + address;
                    }
                }
            });
    </script>
</body>

</html>
