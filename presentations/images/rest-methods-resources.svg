<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="http-end" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="12" refX="12" refY="6" orient="auto">
      <path d="M0,0 L16,6 L0,12 z" fill="#9b1c31"/>
    </marker>
    <marker id="new-end" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="12" refX="12" refY="6" orient="auto">
      <path d="M0,0 L14,6 L0,12 z" fill="#2e7d32"/>
    </marker>
  </defs>

  <!-- the client -->
  <rect x="10" y="15" width="150" height="295" rx="12" fill="#eef4fb" stroke="#1b6ec2" stroke-width="2"/>
  <text x="85" y="160" text-anchor="middle" font-size="22" font-weight="bold" fill="#1b6ec2">Client</text>
  <rect x="45" y="180" width="80" height="54" rx="5" fill="#fff" stroke="#1b6ec2" stroke-width="2"/>
  <line x1="45" y1="194" x2="125" y2="194" stroke="#1b6ec2" stroke-width="2"/>
  <circle cx="54" cy="187" r="2.5" fill="#1b6ec2"/>
  <circle cx="62" cy="187" r="2.5" fill="#1b6ec2"/>
  <line x1="56" y1="207" x2="112" y2="207" stroke="#bbb" stroke-width="3"/>
  <line x1="56" y1="216" x2="100" y2="216" stroke="#bbb" stroke-width="3"/>
  <line x1="56" y1="225" x2="108" y2="225" stroke="#bbb" stroke-width="3"/>

  <!-- the collection and its items -->
  <rect x="480" y="15" width="410" height="297" rx="12" fill="#fbeef0" stroke="#9b1c31" stroke-width="2"/>
  <text x="500" y="47" font-size="19" font-weight="bold" font-family="Menlo, Consolas, 'Courier New', monospace" fill="#9b1c31">/api/actors</text>
  <text x="500" y="70" font-size="15" fill="#333">the collection: all the actors</text>
  <text x="500" y="113" font-size="15" fill="#555">the items:</text>
  <g font-size="16" font-family="Menlo, Consolas, 'Courier New', monospace" fill="#333">
    <rect x="610" y="88" width="265" height="38" rx="6" fill="#fff" stroke="#9b1c31" stroke-width="2"/>
    <text x="626" y="113">/api/actors/1</text>
    <rect x="610" y="136" width="265" height="38" rx="6" fill="#fff" stroke="#9b1c31" stroke-width="2"/>
    <text x="626" y="161">/api/actors/2</text>
    <rect x="610" y="184" width="265" height="38" rx="6" fill="#fff" stroke="#9b1c31" stroke-width="2"/>
    <text x="626" y="209">/api/actors/3</text>
    <rect x="610" y="244" width="265" height="38" rx="6" fill="#fff" stroke="#2e7d32" stroke-width="2" stroke-dasharray="6,4"/>
    <text x="626" y="269">/api/actors/14</text>
  </g>
  <text x="863" y="269" text-anchor="end" font-size="15" font-weight="bold" fill="#2e7d32">new</text>
  <text x="742" y="302" text-anchor="middle" font-size="15" fill="#555">its id is chosen by the service</text>

  <!-- GET to the collection -->
  <line x1="162" y1="60" x2="478" y2="60" stroke="#9b1c31" stroke-width="2.5" marker-end="url(#http-end)"/>
  <text x="180" y="50" font-size="17"><tspan font-weight="bold" fill="#1b6ec2">GET</tspan><tspan font-family="Menlo, Consolas, 'Courier New', monospace" fill="#333"> /api/actors</tspan></text>
  <text x="180" y="82" font-size="15" fill="#555">read all the actors</text>

  <!-- GET, PUT and DELETE to one item -->
  <line x1="162" y1="203" x2="608" y2="203" stroke="#9b1c31" stroke-width="2.5" marker-end="url(#http-end)"/>
  <text x="180" y="193" font-size="17"><tspan font-weight="bold" fill="#1b6ec2">GET</tspan> <tspan font-weight="bold" fill="#b35900">PUT</tspan> <tspan font-weight="bold" fill="#9b1c31">DELETE</tspan><tspan font-family="Menlo, Consolas, 'Courier New', monospace" fill="#333"> /api/actors/3</tspan></text>
  <text x="180" y="225" font-size="15" fill="#555">read, replace or delete one actor</text>

  <!-- POST to the collection: a new item appears -->
  <line x1="162" y1="263" x2="478" y2="263" stroke="#9b1c31" stroke-width="2.5" marker-end="url(#http-end)"/>
  <line x1="488" y1="263" x2="606" y2="263" stroke="#2e7d32" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#new-end)"/>
  <text x="180" y="253" font-size="17"><tspan font-weight="bold" fill="#2e7d32">POST</tspan><tspan font-family="Menlo, Consolas, 'Courier New', monospace" fill="#333"> /api/actors</tspan></text>
  <text x="180" y="285" font-size="15" fill="#555">create a new actor</text>
</svg>
