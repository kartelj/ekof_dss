<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" font-family="Arial, Helvetica, sans-serif">
  <!-- the box of one element, from the outside in: margin, border, padding, content
       (the bands are not drawn to scale: in the sample the border is much thinner) -->
  <rect x="21" y="11" width="498" height="218" fill="#fff" stroke="#b35900" stroke-width="2" stroke-dasharray="8 6"/>
  <rect x="55" y="45" width="430" height="150" fill="#9b1c31"/>
  <rect x="77" y="67" width="386" height="106" fill="#fbeef0"/>
  <rect x="108" y="98" width="324" height="44" fill="#eef4fb" stroke="#1b6ec2" stroke-width="2"/>

  <g font-weight="bold">
    <text x="32" y="35" font-size="17" fill="#b35900">margin</text>
    <text x="63" y="62" font-size="16" fill="#fff">border</text>
    <text x="87" y="90" font-size="17" fill="#6a1b9a">padding</text>
    <text x="270" y="126" font-size="18" fill="#1b6ec2" text-anchor="middle">content</text>
  </g>

  <!-- the declarations of the sample 08-style-block-elem.html, in the colours of the bands -->
  <g font-family="Menlo, Consolas, 'Courier New', monospace" font-size="18" font-weight="bold">
    <text x="560" y="34" textLength="143" lengthAdjust="spacingAndGlyphs" fill="#b35900">margin: 25px;</text>
    <text x="560" y="90" textLength="242" lengthAdjust="spacingAndGlyphs" fill="#9b1c31">border: 2px solid red;</text>
    <text x="560" y="146" textLength="154" lengthAdjust="spacingAndGlyphs" fill="#6a1b9a">padding: 30px;</text>
  </g>
  <text x="560" y="202" font-size="18" font-weight="bold" fill="#1b6ec2">content</text>

  <g font-size="15" fill="#333">
    <text x="560" y="55">empty space outside the border</text>
    <text x="560" y="111">a line around the padding</text>
    <text x="560" y="167">space between the content and the border</text>
    <text x="560" y="223">the text or the image of the element</text>
  </g>
</svg>
