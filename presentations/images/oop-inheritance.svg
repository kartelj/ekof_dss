<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 350" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="derived" markerUnits="userSpaceOnUse" markerWidth="22" markerHeight="20" refX="20" refY="10" orient="auto">
      <path d="M1,1 L20,10 L1,19 z" fill="#fff" stroke="#2e7d32" stroke-width="2"/>
    </marker>
  </defs>

  <!-- the base class -->
  <text x="180" y="26" text-anchor="middle" font-size="16" fill="#555">the base class</text>
  <rect x="30" y="38" width="300" height="188" rx="10" fill="#f1f1f1" stroke="#2e7d32" stroke-width="2"/>
  <text x="180" y="68" text-anchor="middle" font-size="20" font-weight="bold" fill="#2e7d32">class Employee</text>
  <line x1="30" y1="82" x2="330" y2="82" stroke="#2e7d32" stroke-width="2"/>
  <line x1="30" y1="160" x2="330" y2="160" stroke="#2e7d32" stroke-width="1"/>
  <g font-size="16" font-family="Menlo, Consolas, 'Courier New', monospace" fill="#333">
    <text x="48" y="108">name</text>
    <text x="48" y="132">salary</text>
    <text x="48" y="186">monthly_pay()</text>
    <text x="48" y="210">describe()</text>
  </g>

  <!-- the derived class -->
  <text x="720" y="26" text-anchor="middle" font-size="16" fill="#555">the derived class</text>
  <rect x="570" y="38" width="300" height="188" rx="10" fill="#f1f1f1" stroke="#2e7d32" stroke-width="2"/>
  <text x="720" y="68" text-anchor="middle" font-size="20" font-weight="bold" fill="#2e7d32">class Manager(Employee)</text>
  <line x1="570" y1="82" x2="870" y2="82" stroke="#2e7d32" stroke-width="2"/>
  <line x1="570" y1="160" x2="870" y2="160" stroke="#2e7d32" stroke-width="1"/>
  <g font-size="16" font-family="Menlo, Consolas, 'Courier New', monospace">
    <text x="588" y="106" fill="#888">name</text>
    <text x="588" y="128" fill="#888">salary</text>
    <text x="588" y="150" fill="#1b6ec2" font-weight="bold">bonus</text>
    <text x="588" y="186" fill="#b35900" font-weight="bold">monthly_pay()</text>
    <text x="588" y="210" fill="#888">describe()</text>
  </g>
  <g font-size="15" text-anchor="end">
    <text x="856" y="106" fill="#888">inherited</text>
    <text x="856" y="128" fill="#888">inherited</text>
    <text x="856" y="150" fill="#1b6ec2" font-weight="bold">added</text>
    <text x="856" y="186" fill="#b35900" font-weight="bold">overridden</text>
    <text x="856" y="210" fill="#888">inherited</text>
  </g>

  <!-- derived from -->
  <line x1="568" y1="132" x2="332" y2="132" stroke="#2e7d32" stroke-width="2.5" marker-end="url(#derived)"/>
  <text x="450" y="118" text-anchor="middle" font-size="16" fill="#333">is derived from</text>
  <text x="450" y="156" text-anchor="middle" font-size="15" fill="#555">a manager is an employee</text>

  <!-- one object of each class -->
  <g stroke="#999" stroke-width="2" stroke-dasharray="5 4">
    <line x1="180" y1="228" x2="180" y2="258"/>
    <line x1="720" y1="228" x2="720" y2="258"/>
  </g>
  <g fill="#fbeef0" stroke="#9b1c31" stroke-width="2">
    <rect x="30" y="260" width="300" height="84" rx="10"/>
    <rect x="570" y="260" width="300" height="84" rx="10"/>
  </g>
  <g font-size="15" font-weight="bold" fill="#9b1c31">
    <text x="46" y="284">worker: an Employee</text>
    <text x="586" y="284">boss: a Manager</text>
  </g>
  <g font-size="15" font-family="Menlo, Consolas, 'Courier New', monospace" fill="#333">
    <text x="46" y="310">name="Ana", salary=1200</text>
    <text x="586" y="310">name="Marko", salary=2000,</text>
    <text x="586" y="332">bonus=500</text>
  </g>
</svg>
