<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 140" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto">
      <path d="M0,0 L12,5 L0,10 z" fill="#333"/>
    </marker>
  </defs>

  <!-- what a user types is a text -->
  <rect x="10" y="6" width="220" height="128" rx="10" fill="#fdf3e7" stroke="#b35900" stroke-width="2"/>
  <text x="120" y="32" text-anchor="middle" font-size="16" font-weight="bold" fill="#b35900">typed by a user</text>
  <rect x="50" y="46" width="140" height="32" rx="3" fill="#fff" stroke="#999" stroke-width="1.5"/>
  <text x="60" y="68" font-family="Menlo, Consolas, 'Courier New', monospace" font-size="18" fill="#333">12</text>
  <line x1="84" y1="52" x2="84" y2="72" stroke="#333" stroke-width="1.5"/>
  <text x="120" y="102" text-anchor="middle" font-size="15" fill="#333">in a form or in the terminal:</text>
  <text x="120" y="123" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">always a text</text>
  <g stroke="#333" stroke-width="2" marker-end="url(#arrow)">
    <line x1="232" y1="38" x2="296" y2="38"/>
    <line x1="232" y1="104" x2="296" y2="104"/>
  </g>

  <!-- the texts -->
  <g fill="#eef4fb" stroke="#1b6ec2" stroke-width="2">
    <rect x="300" y="12" width="150" height="54" rx="6"/>
    <rect x="300" y="78" width="150" height="54" rx="6"/>
  </g>
  <!-- the numbers -->
  <g fill="#fbeef0" stroke="#9b1c31" stroke-width="2">
    <rect x="690" y="12" width="150" height="54" rx="6"/>
    <rect x="690" y="78" width="150" height="54" rx="6"/>
  </g>
  <g font-family="Menlo, Consolas, 'Courier New', monospace" font-size="20" font-weight="bold" fill="#333" text-anchor="middle">
    <text x="375" y="39">"12"</text>
    <text x="375" y="105">"2.5"</text>
    <text x="765" y="39">12</text>
    <text x="765" y="105">2.5</text>
  </g>
  <g font-family="Menlo, Consolas, 'Courier New', monospace" font-size="15" font-weight="bold" fill="#2e7d32" text-anchor="middle">
    <text x="375" y="59">str</text>
    <text x="375" y="125">str</text>
    <text x="765" y="59">int</text>
    <text x="765" y="125">float</text>
  </g>

  <!-- conversions: to a number and back to a text -->
  <g stroke="#333" stroke-width="2" marker-end="url(#arrow)">
    <line x1="452" y1="30" x2="686" y2="30"/>
    <line x1="688" y1="50" x2="454" y2="50"/>
    <line x1="452" y1="96" x2="686" y2="96"/>
    <line x1="688" y1="116" x2="454" y2="116"/>
  </g>
  <g font-family="Menlo, Consolas, 'Courier New', monospace" font-size="15" text-anchor="middle">
    <text x="570" y="24" fill="#9b1c31" font-weight="bold">int("12")</text>
    <text x="570" y="68" fill="#1b6ec2" font-weight="bold">str(12)</text>
    <text x="570" y="90" fill="#9b1c31" font-weight="bold">float("2.5")</text>
    <text x="570" y="134" fill="#1b6ec2" font-weight="bold">str(2.5)</text>
  </g>
</svg>
