<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 195" font-family="Arial, Helvetica, sans-serif">
  <!-- the statement that creates the list -->
  <text x="150" y="24" font-family="Menlo, Consolas, 'Courier New', monospace" font-size="18" fill="#333">numbers = [24, 48, 96, 192, 36, 72, 144]</text>

  <!-- indexes counted from the beginning -->
  <text x="138" y="58" text-anchor="end" font-size="15" fill="#1b6ec2">index</text>
  <g font-size="17" font-weight="bold" fill="#1b6ec2" text-anchor="middle">
    <text x="200" y="58">0</text>
    <text x="300" y="58">1</text>
    <text x="400" y="58">2</text>
    <text x="500" y="58">3</text>
    <text x="600" y="58">4</text>
    <text x="700" y="58">5</text>
    <text x="800" y="58">6</text>
  </g>

  <!-- the elements -->
  <g fill="#eef4fb" stroke="#1b6ec2" stroke-width="2">
    <rect x="150" y="66" width="100" height="48"/>
    <rect x="250" y="66" width="100" height="48"/>
    <rect x="350" y="66" width="100" height="48"/>
    <rect x="450" y="66" width="100" height="48"/>
    <rect x="550" y="66" width="100" height="48"/>
    <rect x="650" y="66" width="100" height="48"/>
    <rect x="750" y="66" width="100" height="48"/>
  </g>
  <g font-family="Menlo, Consolas, 'Courier New', monospace" font-size="22" font-weight="bold" fill="#333" text-anchor="middle">
    <text x="200" y="98">24</text>
    <text x="300" y="98">48</text>
    <text x="400" y="98">96</text>
    <text x="500" y="98">192</text>
    <text x="600" y="98">36</text>
    <text x="700" y="98">72</text>
    <text x="800" y="98">144</text>
  </g>

  <!-- indexes counted from the end -->
  <text x="138" y="138" text-anchor="end" font-size="15" fill="#6a1b9a">from the end</text>
  <g font-size="17" font-weight="bold" fill="#6a1b9a" text-anchor="middle">
    <text x="200" y="138">-7</text>
    <text x="300" y="138">-6</text>
    <text x="400" y="138">-5</text>
    <text x="500" y="138">-4</text>
    <text x="600" y="138">-3</text>
    <text x="700" y="138">-2</text>
    <text x="800" y="138">-1</text>
  </g>

  <!-- a slice: the elements with the indexes 1, 2 and 3 -->
  <path d="M254,150 v8 h292 v-8" fill="none" stroke="#2e7d32" stroke-width="2"/>
  <text x="400" y="182" text-anchor="middle" font-family="Menlo, Consolas, 'Courier New', monospace" font-size="17" font-weight="bold" fill="#2e7d32">numbers[1:4]</text>

  <!-- the length of the list -->
  <text x="848" y="182" text-anchor="end" font-size="16" fill="#333"><tspan font-family="Menlo, Consolas, 'Courier New', monospace" font-size="17" font-weight="bold" fill="#b35900">len(numbers)</tspan> is 7</text>
</svg>
