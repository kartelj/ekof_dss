  <rect x="20" y="34" width="18" height="18" fill="#9b1c31" fill-opacity="0.14" stroke="#9b1c31" stroke-width="2"/>
  <text x="46" y="49" font-size="17" fill="#333"><tspan font-family="Menlo, Consolas, 'Courier New', monospace" font-weight="bold" fill="#9b1c31">WHERE states = 'France'</tspan> chooses the rows</text>

