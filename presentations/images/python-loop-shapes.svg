<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="12" refX="12" refY="6" orient="auto">
      <path d="M0,0 L14,6 L0,12 z" fill="#555"/>
    </marker>
  </defs>

  <line x1="450" y1="6" x2="450" y2="324" stroke="#ddd" stroke-width="1"/>

  <!-- left: the condition first -->
  <text x="220" y="22" text-anchor="middle" font-size="18" font-weight="bold" fill="#1b6ec2">The condition first</text>
  <text x="220" y="44" text-anchor="middle" font-family="Menlo, Consolas, 'Courier New', monospace" font-size="15" fill="#333">while i &lt;= n: ...</text>
  <line x1="200" y1="54" x2="200" y2="76" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M80,106 l20,-28 h200 l20,28 l-20,28 h-200 z" fill="#eef4fb" stroke="#1b6ec2" stroke-width="2"/>
  <text x="200" y="111" text-anchor="middle" font-family="Menlo, Consolas, 'Courier New', monospace" font-size="16" font-weight="bold" fill="#1b6ec2">i &lt;= n</text>
  <line x1="200" y1="134" x2="200" y2="168" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="210" y="157" font-size="15" font-weight="bold" fill="#2e7d32">True</text>
  <rect x="100" y="170" width="200" height="56" rx="6" fill="#fbeef0" stroke="#9b1c31" stroke-width="2"/>
  <g font-family="Menlo, Consolas, 'Courier New', monospace" font-size="15" fill="#333" text-anchor="middle">
    <text x="200" y="193">fact = fact * i</text>
    <text x="200" y="215">i += 1</text>
  </g>
  <polyline points="100,198 56,198 56,106 78,106" fill="none" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <polyline points="320,106 390,106 390,250" fill="none" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="355" y="98" text-anchor="middle" font-size="15" font-weight="bold" fill="#9b1c31">False</text>
  <text x="390" y="272" text-anchor="middle" font-size="15" fill="#555">after the loop</text>
  <text x="220" y="314" text-anchor="middle" font-size="17" fill="#333">the block may run <tspan font-weight="bold">0 times</tspan></text>

  <!-- right: the condition at the end -->
  <text x="680" y="22" text-anchor="middle" font-size="18" font-weight="bold" fill="#1b6ec2">The condition at the end</text>
  <text x="680" y="44" text-anchor="middle" font-family="Menlo, Consolas, 'Courier New', monospace" font-size="15" fill="#333">while True: ... break</text>
  <line x1="660" y1="54" x2="660" y2="76" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="560" y="78" width="200" height="56" rx="6" fill="#fbeef0" stroke="#9b1c31" stroke-width="2"/>
  <g font-family="Menlo, Consolas, 'Courier New', monospace" font-size="15" fill="#333" text-anchor="middle">
    <text x="660" y="101">fact *= i</text>
    <text x="660" y="123">i += 1</text>
  </g>
  <line x1="660" y1="134" x2="660" y2="166" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M540,196 l20,-28 h200 l20,28 l-20,28 h-200 z" fill="#eef4fb" stroke="#1b6ec2" stroke-width="2"/>
  <text x="660" y="201" text-anchor="middle" font-family="Menlo, Consolas, 'Courier New', monospace" font-size="16" font-weight="bold" fill="#1b6ec2">i &gt; n</text>
  <polyline points="540,196 506,196 506,106 558,106" fill="none" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="514" y="160" font-size="15" font-weight="bold" fill="#9b1c31">False</text>
  <polyline points="780,196 850,196 850,250" fill="none" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="815" y="188" text-anchor="middle" font-size="15" font-weight="bold" fill="#2e7d32">True</text>
  <text x="842" y="232" text-anchor="end" font-family="Menlo, Consolas, 'Courier New', monospace" font-size="15" font-weight="bold" fill="#9b1c31">break</text>
  <text x="850" y="272" text-anchor="middle" font-size="15" fill="#555">after the loop</text>
  <text x="680" y="314" text-anchor="middle" font-size="17" fill="#333">the block runs <tspan font-weight="bold">at least once</tspan></text>
</svg>
