<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 270" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="12" refX="12" refY="6" orient="auto">
      <path d="M0,0 L14,6 L0,12 z" fill="#555"/>
    </marker>
    <marker id="arrow-green" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="12" refX="12" refY="6" orient="auto">
      <path d="M0,0 L14,6 L0,12 z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-crimson" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="12" refX="12" refY="6" orient="auto">
      <path d="M0,0 L14,6 L0,12 z" fill="#9b1c31"/>
    </marker>
  </defs>

  <!-- the transaction: a dashed frame around the statements that belong together -->
  <rect x="4" y="74" width="566" height="118" rx="12" fill="#f7f7f7" stroke="#555" stroke-width="2" stroke-dasharray="8 5"/>
  <text x="18" y="96" font-size="16" fill="#555">inside the transaction</text>

  <g fill="#fff" stroke="#1b6ec2" stroke-width="2">
    <rect x="18" y="108" width="160" height="70" rx="8"/>
    <rect x="212" y="108" width="160" height="70" rx="8"/>
    <rect x="406" y="108" width="150" height="70" rx="8"/>
  </g>
  <g font-family="Menlo, Consolas, 'Courier New', monospace" font-size="18" font-weight="bold" fill="#1b6ec2" text-anchor="middle">
    <text x="98" y="136">BEGIN</text>
    <text x="292" y="136">UPDATE</text>
    <text x="481" y="136">SELECT</text>
  </g>
  <g font-size="16" fill="#333" text-anchor="middle">
    <text x="98" y="162">profit: 0</text>
    <text x="292" y="162">profit + 500000</text>
    <text x="481" y="162">sees 500000</text>
  </g>
  <g stroke="#555" stroke-width="2.5" marker-end="url(#arrow)">
    <line x1="180" y1="143" x2="208" y2="143"/>
    <line x1="374" y1="143" x2="402" y2="143"/>
  </g>

  <!-- the two ways to end it -->
  <path d="M558,128 C600,128 600,52 640,52" fill="none" stroke="#2e7d32" stroke-width="2.5" marker-end="url(#arrow-green)"/>
  <path d="M558,158 C600,158 600,222 640,222" fill="none" stroke="#9b1c31" stroke-width="2.5" marker-end="url(#arrow-crimson)"/>

  <rect x="644" y="18" width="250" height="70" rx="8" fill="#edf6ee" stroke="#2e7d32" stroke-width="2"/>
  <text x="660" y="46" font-family="Menlo, Consolas, 'Courier New', monospace" font-size="18" font-weight="bold" fill="#2e7d32">COMMIT</text>
  <text x="660" y="72" font-size="16" fill="#333">the change stays: 500000</text>

  <rect x="644" y="188" width="250" height="70" rx="8" fill="#fbeef0" stroke="#9b1c31" stroke-width="2"/>
  <text x="660" y="216" font-family="Menlo, Consolas, 'Courier New', monospace" font-size="18" font-weight="bold" fill="#9b1c31">ROLLBACK</text>
  <text x="660" y="242" font-size="16" fill="#333">the change is gone: 0</text>

  <text x="18" y="232" font-size="16" fill="#555">profit - the profit of the three French films;</text>
  <text x="18" y="254" font-size="16" fill="#555">other connections do not see 500000 before COMMIT</text>
</svg>
