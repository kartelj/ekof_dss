<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 392" font-family="Arial, Helvetica, sans-serif">
  <!-- 1. the layout: the frame, with two places (blocks) for the page -->
  <text x="143" y="26" text-anchor="middle" font-size="18" font-weight="bold" font-family="Menlo, Consolas, 'Courier New', monospace" fill="#9b1c31">layout.html</text>
  <text x="143" y="50" text-anchor="middle" font-size="15" fill="#555">the frame of every page</text>
  <rect x="12" y="66" width="262" height="320" rx="6" fill="#fff" stroke="#999" stroke-width="1.5"/>
  <rect x="15" y="69" width="256" height="34" rx="4" fill="#fdf3e7" stroke="#b35900" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="24" y="91" font-size="15" font-family="Menlo, Consolas, 'Courier New', monospace" fill="#b35900">{% block title %}</text>
  <text x="186" y="91" font-size="15" fill="#555">DSS</text>
  <rect x="13" y="106" width="96" height="279" fill="#306998"/>
  <text x="61" y="140" text-anchor="middle" font-size="16" font-weight="bold" fill="#fff">the menu</text>
  <g font-size="15" font-family="Menlo, Consolas, 'Courier New', monospace" fill="#fff" text-anchor="middle">
    <text x="61" y="176">include</text>
    <text x="61" y="198">nav_menu</text>
    <text x="61" y="220">.html</text>
  </g>
  <rect x="118" y="114" width="148" height="262" rx="4" fill="#edf7ee" stroke="#2e7d32" stroke-width="2" stroke-dasharray="6 4"/>
  <g font-size="15" font-family="Menlo, Consolas, 'Courier New', monospace" fill="#2e7d32" text-anchor="middle">
    <text x="192" y="220">{% block</text>
    <text x="192" y="242">content %}</text>
  </g>
  <g font-size="15" fill="#555" text-anchor="middle">
    <text x="192" y="282">a place for</text>
    <text x="192" y="302">the page</text>
  </g>

  <text x="296" y="238" text-anchor="middle" font-size="44" font-weight="bold" fill="#555">+</text>

  <!-- 2. the page: only the content of the blocks -->
  <text x="450" y="26" text-anchor="middle" font-size="18" font-weight="bold" font-family="Menlo, Consolas, 'Courier New', monospace" fill="#9b1c31">incrementer.html</text>
  <text x="450" y="50" text-anchor="middle" font-size="15" fill="#555">only what is special for the page</text>
  <text x="319" y="84" font-size="15" font-family="Menlo, Consolas, 'Courier New', monospace" fill="#333">{% extends "layout.html" %}</text>
  <rect x="319" y="98" width="262" height="62" rx="6" fill="#fdf3e7" stroke="#b35900" stroke-width="2"/>
  <text x="331" y="122" font-size="15" font-family="Menlo, Consolas, 'Courier New', monospace" fill="#b35900">{% block title %}</text>
  <text x="331" y="147" font-size="15" font-weight="bold" font-family="Menlo, Consolas, 'Courier New', monospace" fill="#333">Incrementer</text>
  <rect x="319" y="172" width="262" height="214" rx="6" fill="#edf7ee" stroke="#2e7d32" stroke-width="2"/>
  <text x="331" y="196" font-size="15" font-family="Menlo, Consolas, 'Courier New', monospace" fill="#2e7d32">{% block content %}</text>
  <g font-size="15" font-family="Menlo, Consolas, 'Courier New', monospace" fill="#333">
    <text x="331" y="223">&lt;h1&gt;Incrementer&lt;/h1&gt;</text>
    <text x="331" y="244">&lt;p&gt;Current count:</text>
    <text x="349" y="265">{{ current_count }}</text>
    <text x="331" y="286">&lt;/p&gt;</text>
    <text x="331" y="307">&lt;form ...&gt;</text>
    <text x="349" y="328">&lt;button&gt;Increase</text>
    <text x="349" y="349">&lt;/button&gt;</text>
    <text x="331" y="370">&lt;/form&gt;</text>
  </g>

  <text x="603" y="238" text-anchor="middle" font-size="44" font-weight="bold" fill="#555">=</text>

  <!-- 3. what the browser receives: the layout with the blocks filled -->
  <text x="757" y="26" text-anchor="middle" font-size="18" font-weight="bold" fill="#1b6ec2">in the browser</text>
  <text x="757" y="50" text-anchor="middle" font-size="15" font-family="Menlo, Consolas, 'Courier New', monospace" fill="#555">GET /incrementer</text>
  <rect x="626" y="66" width="262" height="320" rx="6" fill="#fff" stroke="#1b6ec2" stroke-width="2"/>
  <rect x="627" y="67" width="260" height="38" rx="5" fill="#eef4fb"/>
  <rect x="636" y="75" width="132" height="30" rx="4" fill="#fff" stroke="#b35900" stroke-width="1.5"/>
  <text x="702" y="96" text-anchor="middle" font-size="15" font-weight="bold" fill="#b35900">Incrementer</text>
  <line x1="627" y1="105" x2="887" y2="105" stroke="#1b6ec2" stroke-width="1"/>
  <rect x="627" y="106" width="96" height="279" fill="#306998"/>
  <g font-size="15" fill="#fff">
    <text x="639" y="134" font-weight="bold">DSS</text>
    <text x="639" y="166">Home</text>
    <text x="639" y="192">Basics</text>
    <text x="639" y="218">Branches</text>
    <text x="639" y="244">Loops</text>
    <text x="639" y="270">Functions</text>
  </g>
  <rect x="731" y="114" width="149" height="262" rx="4" fill="none" stroke="#2e7d32" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="741" y="150" font-size="21" font-weight="bold" fill="#222">Incrementer</text>
  <text x="741" y="184" font-size="15" fill="#333">Current count: 42</text>
  <rect x="741" y="200" width="84" height="32" rx="4" fill="#fff" stroke="#6c757d" stroke-width="1.5"/>
  <text x="783" y="221" text-anchor="middle" font-size="15" fill="#555">Increase</text>
</svg>
