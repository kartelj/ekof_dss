<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 326" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="12" refX="14" refY="6" orient="auto">
      <path d="M0,0 L16,6 L0,12 z" fill="#9b1c31"/>
    </marker>
  </defs>

  <!-- the pages: each one only declares that it needs the service -->
  <text x="145" y="22" text-anchor="middle" font-size="15" fill="#555">three pages: each only asks for a service</text>
  <g fill="#eef4fb" stroke="#1b6ec2" stroke-width="2">
    <rect x="10" y="38" width="270" height="76" rx="8"/>
    <rect x="10" y="128" width="270" height="76" rx="8"/>
    <rect x="10" y="218" width="270" height="76" rx="8"/>
  </g>
  <g font-size="16" font-weight="bold" font-family="Menlo, Consolas, 'Courier New', monospace" fill="#1b6ec2">
    <text x="24" y="66">pages/dashboard.py</text>
    <text x="24" y="156">pages/actors.py</text>
    <text x="24" y="246">pages/actor_detail.py</text>
  </g>
  <g font-size="15" font-family="Menlo, Consolas, 'Courier New', monospace" fill="#333">
    <text x="24" y="96">show(..., actor_service)</text>
    <text x="24" y="186">show(..., actor_service)</text>
    <text x="24" y="276">show(..., actor_service)</text>
  </g>

  <!-- FastAPI: calls the dependency and passes the result on -->
  <rect x="370" y="100" width="200" height="132" rx="10" fill="#fbeef0" stroke="#9b1c31" stroke-width="2"/>
  <text x="470" y="130" text-anchor="middle" font-size="20" font-weight="bold" fill="#9b1c31">FastAPI</text>
  <g font-size="15" fill="#333" text-anchor="middle">
    <text x="470" y="157">before it calls a page,</text>
    <text x="470" y="178">it calls</text>
  </g>
  <text x="470" y="206" text-anchor="middle" font-size="15" font-family="Menlo, Consolas, 'Courier New', monospace" fill="#333">get_actor_service()</text>

  <g stroke="#9b1c31" stroke-width="3" fill="none">
    <line x1="368" y1="140" x2="284" y2="78" marker-end="url(#arrow)"/>
    <line x1="368" y1="166" x2="284" y2="166" marker-end="url(#arrow)"/>
    <line x1="368" y1="192" x2="284" y2="256" marker-end="url(#arrow)"/>
  </g>
  <text x="326" y="156" text-anchor="middle" font-size="15" fill="#333">passes it</text>

  <!-- the one service object of the application -->
  <rect x="650" y="38" width="240" height="256" rx="10" fill="#fff" stroke="#2e7d32" stroke-width="2"/>
  <text x="770" y="64" text-anchor="middle" font-size="18" font-weight="bold" fill="#2e7d32">one service object</text>
  <text x="770" y="88" text-anchor="middle" font-size="15" font-family="Menlo, Consolas, 'Courier New', monospace" fill="#555">_actor_service</text>
  <line x1="650" y1="100" x2="890" y2="100" stroke="#2e7d32" stroke-width="2"/>
  <text x="664" y="124" font-size="15" fill="#555">the actors:</text>
  <g font-size="15" fill="#333">
    <text x="664" y="150">1  Bata Živojinović</text>
    <text x="664" y="172">2  Julia Roberts</text>
    <text x="664" y="194">3  Robert De Niro</text>
    <text x="664" y="216">4  Al Pacino</text>
    <text x="664" y="238">5  Tom Cruise</text>
    <text x="664" y="260">...</text>
  </g>
  <text x="770" y="316" text-anchor="middle" font-size="15" fill="#555">read once, from actors.json</text>

  <line x1="648" y1="166" x2="574" y2="166" stroke="#2e7d32" stroke-width="3" marker-end="url(#arrow-green)"/>
  <defs>
    <marker id="arrow-green" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="12" refX="14" refY="6" orient="auto">
      <path d="M0,0 L16,6 L0,12 z" fill="#2e7d32"/>
    </marker>
  </defs>
  <text x="610" y="156" text-anchor="middle" font-size="15" fill="#333">returns</text>
</svg>
