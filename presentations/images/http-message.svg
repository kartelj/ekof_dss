<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" font-family="Arial, Helvetica, sans-serif">
  <!-- the titles -->
  <text x="220" y="26" text-anchor="middle" font-size="22" font-weight="bold" fill="#1b6ec2">Request</text>
  <text x="680" y="26" text-anchor="middle" font-size="22" font-weight="bold" fill="#9b1c31">Response</text>

  <g font-size="15" font-weight="bold">
    <!-- the first line -->
    <rect x="10" y="42" width="420" height="66" rx="6" fill="#fff" stroke="#9b1c31" stroke-width="2"/>
    <text x="22" y="64" fill="#9b1c31">request line: method, path, version</text>
    <rect x="470" y="42" width="420" height="66" rx="6" fill="#fff" stroke="#9b1c31" stroke-width="2"/>
    <text x="482" y="64" fill="#9b1c31">status line: version, status code, description</text>

    <!-- the headers -->
    <rect x="10" y="118" width="420" height="96" rx="6" fill="#fff" stroke="#1b6ec2" stroke-width="2"/>
    <text x="22" y="140" fill="#1b6ec2">headers: one Name: value per line</text>
    <rect x="470" y="118" width="420" height="96" rx="6" fill="#fff" stroke="#1b6ec2" stroke-width="2"/>
    <text x="482" y="140" fill="#1b6ec2">headers: one Name: value per line</text>

    <!-- the empty line -->
    <rect x="10" y="224" width="420" height="34" rx="6" fill="#f1f1f1" stroke="#999" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="22" y="246" fill="#777">an empty line</text>
    <rect x="470" y="224" width="420" height="34" rx="6" fill="#f1f1f1" stroke="#999" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="482" y="246" fill="#777">an empty line</text>

    <!-- the body -->
    <rect x="10" y="268" width="420" height="142" rx="6" fill="#fff" stroke="#2e7d32" stroke-width="2"/>
    <text x="22" y="290" fill="#2e7d32">body: often empty</text>
    <rect x="470" y="268" width="420" height="142" rx="6" fill="#fff" stroke="#2e7d32" stroke-width="2"/>
    <text x="482" y="290" fill="#2e7d32">body: the resource itself</text>
  </g>

  <!-- the content of the two messages -->
  <g font-size="15" font-family="Menlo, Consolas, 'Courier New', monospace" fill="#333">
    <text x="22" y="92">POST /process-form HTTP/1.1</text>
    <text x="22" y="166">Host: localhost:8000</text>
    <text x="22" y="188">Content-Type: application/</text>
    <text x="148" y="206">x-www-form-urlencoded</text>
    <text x="22" y="318">first_name=Holly&amp;last_name=Hunter</text>
    <text x="22" y="350" font-family="Arial, Helvetica, sans-serif" fill="#555">(only when the client sends data,</text>
    <text x="22" y="372" font-family="Arial, Helvetica, sans-serif" fill="#555">for example the values of a form)</text>

    <text x="482" y="92">HTTP/1.1 200 OK</text>
    <text x="482" y="166">Content-Type: text/html; charset=utf-8</text>
    <text x="482" y="188">Content-Length: 309</text>
    <text x="482" y="318">&lt;!DOCTYPE html&gt;</text>
    <text x="482" y="340">&lt;html&gt;</text>
    <text x="482" y="362">&lt;head&gt;</text>
    <text x="482" y="384">...</text>
  </g>
</svg>
