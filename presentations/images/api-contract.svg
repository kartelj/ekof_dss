<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 350" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="call-end" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="12" refX="12" refY="6" orient="auto">
      <path d="M0,0 L14,6 L0,12 z" fill="#555"/>
    </marker>
    <!-- a hollow triangle: "is a kind of" (inheritance) -->
    <marker id="is-a" markerUnits="userSpaceOnUse" markerWidth="20" markerHeight="18" refX="18" refY="9" orient="auto">
      <path d="M1,1 L18,9 L1,17 z" fill="#fff" stroke="#b35900" stroke-width="2"/>
    </marker>
    <marker id="http-end" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="12" refX="12" refY="6" orient="auto">
      <path d="M0,0 L16,6 L0,12 z" fill="#9b1c31"/>
    </marker>
    <marker id="sql-end" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="12" refX="12" refY="6" orient="auto">
      <path d="M0,0 L16,6 L0,12 z" fill="#2e7d32"/>
    </marker>
  </defs>

  <!-- the pages -->
  <rect x="280" y="10" width="340" height="62" rx="10" fill="#fff" stroke="#555" stroke-width="2"/>
  <text x="450" y="35" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">The pages</text>
  <text x="450" y="60" text-anchor="middle" font-size="15" font-family="Menlo, Consolas, 'Courier New', monospace" fill="#333">actor_service.get_actors()</text>
  <line x1="450" y1="72" x2="450" y2="103" stroke="#555" stroke-width="2.5" marker-end="url(#call-end)"/>

  <!-- the contract -->
  <rect x="280" y="105" width="340" height="62" rx="10" fill="#fdf3e8" stroke="#b35900" stroke-width="2" stroke-dasharray="8,5"/>
  <text x="450" y="132" text-anchor="middle" font-size="18" font-weight="bold" font-family="Menlo, Consolas, 'Courier New', monospace" fill="#b35900">ActorService</text>
  <text x="450" y="155" text-anchor="middle" font-size="15" font-style="italic" fill="#333">abstract: what a page may ask for</text>

  <!-- who chooses -->
  <text x="20" y="128" font-size="15" fill="#555"><tspan font-family="Menlo, Consolas, 'Courier New', monospace">dependencies.py</tspan></text>
  <text x="20" y="150" font-size="15" fill="#555">decides which one</text>
  <text x="20" y="170" font-size="15" fill="#555">the pages get</text>

  <!-- the two implementations -->
  <rect x="40" y="215" width="360" height="56" rx="10" fill="#fff" stroke="#b35900" stroke-width="2"/>
  <text x="220" y="240" text-anchor="middle" font-size="17" font-weight="bold" font-family="Menlo, Consolas, 'Courier New', monospace" fill="#333">FileActorService</text>
  <text x="220" y="262" text-anchor="middle" font-size="15" fill="#555">module 04</text>
  <rect x="500" y="215" width="360" height="56" rx="10" fill="#fff" stroke="#b35900" stroke-width="2"/>
  <text x="680" y="240" text-anchor="middle" font-size="17" font-weight="bold" font-family="Menlo, Consolas, 'Courier New', monospace" fill="#333">RestActorService</text>
  <text x="680" y="262" text-anchor="middle" font-size="15" fill="#555">module 07</text>
  <line x1="220" y1="214" x2="372" y2="169" stroke="#b35900" stroke-width="2" marker-end="url(#is-a)"/>
  <line x1="680" y1="214" x2="528" y2="169" stroke="#b35900" stroke-width="2" marker-end="url(#is-a)"/>
  <text x="450" y="205" text-anchor="middle" font-size="15" fill="#555">both are an ActorService</text>

  <!-- where their data comes from: a file, or a RESTful service -->
  <line x1="120" y1="271" x2="120" y2="296" stroke="#555" stroke-width="2.5" marker-end="url(#call-end)"/>
  <path d="M104,299 h22 l10,10 v32 h-32 z" fill="#fff" stroke="#555" stroke-width="2"/>
  <path d="M126,299 v10 h10" fill="none" stroke="#555" stroke-width="2"/>
  <text x="148" y="326" font-size="15" font-family="Menlo, Consolas, 'Courier New', monospace" fill="#333">sample-data/actors.json</text>

  <line x1="600" y1="271" x2="600" y2="296" stroke="#9b1c31" stroke-width="2.5" marker-end="url(#http-end)"/>
  <text x="610" y="290" font-size="15" font-weight="bold" fill="#333">HTTP</text>
  <rect x="520" y="298" width="170" height="44" rx="8" fill="#fbeef0" stroke="#9b1c31" stroke-width="2"/>
  <text x="605" y="326" text-anchor="middle" font-size="16" font-weight="bold" fill="#9b1c31">RESTful service</text>
  <line x1="692" y1="320" x2="758" y2="320" stroke="#2e7d32" stroke-width="2.5" marker-end="url(#sql-end)"/>
  <path d="M765,305 v28 a30,8 0 0 0 60,0 v-28" fill="#f1f1f1" stroke="#2e7d32" stroke-width="2"/>
  <ellipse cx="795" cy="305" rx="30" ry="8" fill="#f1f1f1" stroke="#2e7d32" stroke-width="2"/>
  <text x="835" y="326" font-size="15" fill="#2e7d32">database</text>
</svg>
