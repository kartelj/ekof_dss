<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 270" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="12" refX="12" refY="6" orient="auto">
      <path d="M0,0 L14,6 L0,12 z" fill="#555"/>
    </marker>
    <marker id="arrow-crimson" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="12" refX="12" refY="6" orient="auto">
      <path d="M0,0 L14,6 L0,12 z" fill="#9b1c31"/>
    </marker>
    <marker id="arrow-green" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="12" refX="12" refY="6" orient="auto">
      <path d="M0,0 L14,6 L0,12 z" fill="#2e7d32"/>
    </marker>
    <pattern id="wall" patternUnits="userSpaceOnUse" width="10" height="10" patternTransform="rotate(45)">
      <rect width="10" height="10" fill="#fbeef0"/>
      <line x1="0" y1="0" x2="0" y2="10" stroke="#9b1c31" stroke-width="3"/>
    </pattern>
  </defs>

  <!-- the two clients -->
  <rect x="6" y="34" width="190" height="72" rx="10" fill="#eef4fb" stroke="#1b6ec2" stroke-width="2"/>
  <text x="101" y="64" text-anchor="middle" font-size="17" font-weight="bold" fill="#1b6ec2">a web page</text>
  <text x="101" y="88" text-anchor="middle" font-size="15" fill="#333">anybody can read it</text>
  <rect x="6" y="160" width="190" height="72" rx="10" fill="#eef4fb" stroke="#1b6ec2" stroke-width="2"/>
  <text x="101" y="190" text-anchor="middle" font-size="17" font-weight="bold" fill="#1b6ec2">our Python program</text>
  <text x="101" y="214" text-anchor="middle" font-size="15" fill="#333">on a server</text>

  <!-- the keys -->
  <line x1="198" y1="70" x2="354" y2="70" stroke="#555" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="276" y="60" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">publishable key</text>
  <line x1="198" y1="196" x2="354" y2="196" stroke="#555" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="276" y="186" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">secret key</text>

  <!-- the Supabase project -->
  <rect x="362" y="4" width="534" height="262" rx="12" fill="#fff" stroke="#555" stroke-width="2" stroke-dasharray="8 5"/>
  <text x="378" y="26" font-size="16" font-weight="bold" fill="#555">the Supabase project</text>
  <rect x="378" y="40" width="110" height="186" rx="8" fill="#f1f1f1" stroke="#555" stroke-width="2"/>
  <text x="433" y="128" text-anchor="middle" font-size="17" font-weight="bold" fill="#333">Data</text>
  <text x="433" y="150" text-anchor="middle" font-size="17" font-weight="bold" fill="#333">API</text>

  <!-- row level security: a wall without a door for anon -->
  <rect x="660" y="40" width="22" height="186" fill="url(#wall)" stroke="#9b1c31" stroke-width="2"/>
  <text x="671" y="250" text-anchor="middle" font-size="15" fill="#9b1c31">row level security</text>

  <!-- the table -->
  <rect x="740" y="100" width="140" height="66" rx="8" fill="#fbeef0" stroke="#9b1c31" stroke-width="2"/>
  <text x="810" y="128" text-anchor="middle" font-size="17" font-weight="bold" fill="#9b1c31">table</text>
  <text x="810" y="152" text-anchor="middle" font-family="Menlo, Consolas, 'Courier New', monospace" font-size="16" fill="#333">actor</text>

  <!-- anon: stopped, there is no policy -->
  <line x1="490" y1="70" x2="652" y2="70" stroke="#9b1c31" stroke-width="2.5" marker-end="url(#arrow-crimson)"/>
  <text x="500" y="60" font-size="16" fill="#333">role <tspan font-family="Menlo, Consolas, 'Courier New', monospace" font-weight="bold">anon</tspan></text>
  <text x="500" y="96" font-size="15" fill="#9b1c31">no policy: nothing</text>
  <path d="M694,58 l20,20 M714,58 l-20,20" stroke="#9b1c31" stroke-width="4"/>

  <!-- service_role: row level security does not stop it -->
  <path d="M490,196 H700 C730,196 730,150 736,150" fill="none" stroke="#2e7d32" stroke-width="3" marker-end="url(#arrow-green)"/>
  <text x="500" y="186" font-size="16" fill="#333">role <tspan font-family="Menlo, Consolas, 'Courier New', monospace" font-weight="bold">service_role</tspan></text>
  <text x="500" y="220" font-size="15" fill="#2e7d32">grant: select, insert,</text>
  <text x="500" y="240" font-size="15" fill="#2e7d32">update, delete</text>
</svg>
