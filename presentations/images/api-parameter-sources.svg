<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <!-- arrow heads in the colours of the three sources -->
    <marker id="path-end" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="12" refX="12" refY="6" orient="auto">
      <path d="M0,0 L16,6 L0,12 z" fill="#1b6ec2"/>
    </marker>
    <marker id="body-end" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="12" refX="12" refY="6" orient="auto">
      <path d="M0,0 L16,6 L0,12 z" fill="#b35900"/>
    </marker>
    <marker id="dependency-end" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="12" refX="12" refY="6" orient="auto">
      <path d="M0,0 L16,6 L0,12 z" fill="#2e7d32"/>
    </marker>
  </defs>

  <!-- the request -->
  <rect x="15" y="15" width="440" height="210" rx="10" fill="#f7f7f7" stroke="#9b1c31" stroke-width="2"/>
  <text x="30" y="42" font-size="18" font-weight="bold" fill="#9b1c31">The HTTP request</text>
  <rect x="171" y="56" width="17" height="22" rx="3" fill="#dbe9f8" stroke="#1b6ec2" stroke-width="2"/>
  <rect x="24" y="137" width="422" height="78" rx="6" fill="#fdf3e8" stroke="#b35900" stroke-width="2"/>
  <g font-size="15" font-family="Menlo, Consolas, 'Courier New', monospace" fill="#333">
    <text y="72"><tspan x="30">PUT /api/actors/</tspan><tspan x="175" font-weight="bold" fill="#1b6ec2">5</tspan><tspan x="193"> HTTP/1.1</tspan></text>
    <text x="30" y="96">Host: localhost:8001</text>
    <text x="30" y="120">Content-Type: application/json</text>
    <text x="32" y="159">{"actor_id": 5, "last_name": "Cruise",</text>
    <text x="32" y="181"> "first_name": "Tom", "country_id": 1,</text>
    <text x="32" y="203"> "date_of_birth": "1962-07-03"}</text>
  </g>

  <!-- not in the request: a dependency -->
  <rect x="15" y="245" width="440" height="75" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="30" y="271" font-size="17" font-weight="bold" fill="#2e7d32">Not in the request: a dependency</text>
  <text x="30" y="300" font-size="15" fill="#333"><tspan font-family="Menlo, Consolas, 'Courier New', monospace">Depends(get_session)</tspan> - FastAPI calls the function</text>

  <!-- our function -->
  <rect x="560" y="60" width="325" height="215" rx="10" fill="#fff" stroke="#555" stroke-width="2"/>
  <text x="575" y="88" font-size="18" font-weight="bold" fill="#333">Our function</text>
  <rect x="568" y="139" width="309" height="24" rx="4" fill="#dbe9f8" stroke="#1b6ec2" stroke-width="2"/>
  <rect x="568" y="171" width="309" height="24" rx="4" fill="#fdf3e8" stroke="#b35900" stroke-width="2"/>
  <rect x="568" y="203" width="309" height="24" rx="4" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <g font-size="15" font-family="Menlo, Consolas, 'Courier New', monospace" fill="#333">
    <text x="578" y="123">def put_actor(</text>
    <text x="578" y="156">    actor_id: int,</text>
    <text x="578" y="188">    data: ActorData,</text>
    <text x="578" y="220">    session: SessionDep,</text>
    <text x="578" y="252">) -&gt; None:</text>
  </g>

  <!-- where each value comes from -->
  <line x1="457" y1="67" x2="565" y2="148" stroke="#1b6ec2" stroke-width="2.5" marker-end="url(#path-end)"/>
  <line x1="448" y1="182" x2="565" y2="183" stroke="#b35900" stroke-width="2.5" marker-end="url(#body-end)"/>
  <line x1="457" y1="282" x2="565" y2="217" stroke="#2e7d32" stroke-width="2.5" marker-end="url(#dependency-end)"/>
  <g font-size="15" font-weight="bold">
    <text x="470" y="62" fill="#1b6ec2">the path</text>
    <text x="466" y="173" fill="#b35900">the body</text>
    <text x="482" y="298" fill="#2e7d32">FastAPI</text>
  </g>
</svg>
