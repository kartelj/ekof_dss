<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 356" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="12" refX="14" refY="6" orient="auto">
      <path d="M0,0 L16,6 L0,12 z" fill="#333"/>
    </marker>
  </defs>

  <!-- the one call of the loop -->
  <text x="300" y="20" text-anchor="middle" font-size="15" fill="#555">the same call for every person of the list:</text>
  <text x="300" y="46" text-anchor="middle" font-size="18" font-weight="bold" font-family="Menlo, Consolas, 'Courier New', monospace" fill="#333">person.monthly_pay()</text>

  <!-- the three objects -->
  <g fill="#fbeef0" stroke="#9b1c31" stroke-width="2">
    <rect x="8" y="76" width="160" height="60" rx="10"/>
    <rect x="8" y="176" width="160" height="60" rx="10"/>
    <rect x="8" y="276" width="160" height="60" rx="10"/>
  </g>
  <g font-size="17" font-weight="bold" fill="#9b1c31" text-anchor="middle">
    <text x="88" y="101">Ana</text>
    <text x="88" y="201">Marko</text>
    <text x="88" y="301">Ivana</text>
  </g>
  <g font-size="15" fill="#555" text-anchor="middle">
    <text x="88" y="124">an Employee</text>
    <text x="88" y="224">a Manager</text>
    <text x="88" y="324">an Employee</text>
  </g>

  <!-- the method of the class Manager -->
  <rect x="214" y="166" width="190" height="80" rx="10" fill="#f1f1f1" stroke="#b35900" stroke-width="2"/>
  <g font-size="15" font-family="Menlo, Consolas, 'Courier New', monospace">
    <text x="228" y="188" font-weight="bold" fill="#b35900">Manager.</text>
    <text x="228" y="207" font-weight="bold" fill="#b35900">monthly_pay()</text>
    <text x="228" y="233" fill="#333">salary + bonus</text>
  </g>

  <!-- the method of the class Employee -->
  <rect x="440" y="66" width="152" height="280" rx="10" fill="#f1f1f1" stroke="#2e7d32" stroke-width="2"/>
  <g font-size="15" font-family="Menlo, Consolas, 'Courier New', monospace">
    <text x="452" y="196" font-weight="bold" fill="#2e7d32">Employee.</text>
    <text x="452" y="215" font-weight="bold" fill="#2e7d32">monthly_pay()</text>
    <text x="452" y="241" fill="#333">salary</text>
  </g>

  <!-- every object goes to the method of its own class -->
  <g stroke="#333" stroke-width="2.5" fill="none">
    <line x1="170" y1="106" x2="436" y2="106" marker-end="url(#arrow)"/>
    <line x1="170" y1="206" x2="210" y2="206" marker-end="url(#arrow)"/>
    <line x1="170" y1="306" x2="436" y2="306" marker-end="url(#arrow)"/>
  </g>
  <g font-size="15" fill="#333" text-anchor="middle">
    <text x="300" y="97">returns 1200</text>
    <text x="300" y="297">returns 1500</text>
    <text x="309" y="268">returns 2500</text>
  </g>
</svg>
