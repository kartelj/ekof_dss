<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 288" font-family="Arial, Helvetica, sans-serif">
  <!-- the 12 columns of a row: numbers on top, a light stripe for every column -->
  <g font-size="16" font-weight="bold" fill="#9b1c31" text-anchor="middle">
    <text x="55" y="28">1</text>
    <text x="105" y="28">2</text>
    <text x="155" y="28">3</text>
    <text x="205" y="28">4</text>
    <text x="255" y="28">5</text>
    <text x="305" y="28">6</text>
    <text x="355" y="28">7</text>
    <text x="405" y="28">8</text>
    <text x="455" y="28">9</text>
    <text x="505" y="28">10</text>
    <text x="555" y="28">11</text>
    <text x="605" y="28">12</text>
  </g>
  <g fill="#f1f1f1">
    <rect x="34" y="38" width="42" height="240"/>
    <rect x="84" y="38" width="42" height="240"/>
    <rect x="134" y="38" width="42" height="240"/>
    <rect x="184" y="38" width="42" height="240"/>
    <rect x="234" y="38" width="42" height="240"/>
    <rect x="284" y="38" width="42" height="240"/>
    <rect x="334" y="38" width="42" height="240"/>
    <rect x="384" y="38" width="42" height="240"/>
    <rect x="434" y="38" width="42" height="240"/>
    <rect x="484" y="38" width="42" height="240"/>
    <rect x="534" y="38" width="42" height="240"/>
    <rect x="584" y="38" width="42" height="240"/>
  </g>

  <!-- six rows; in every row the widths of the elements add up to 12 -->
  <g fill="#eef4fb" stroke="#1b6ec2" stroke-width="1.5">
    <rect x="34" y="48" width="592" height="30" rx="4"/>

    <rect x="34" y="86" width="292" height="30" rx="4"/>
    <rect x="334" y="86" width="292" height="30" rx="4"/>

    <rect x="34" y="124" width="192" height="30" rx="4"/>
    <rect x="234" y="124" width="192" height="30" rx="4"/>
    <rect x="434" y="124" width="192" height="30" rx="4"/>

    <rect x="34" y="162" width="142" height="30" rx="4"/>
    <rect x="184" y="162" width="142" height="30" rx="4"/>
    <rect x="334" y="162" width="142" height="30" rx="4"/>
    <rect x="484" y="162" width="142" height="30" rx="4"/>

    <rect x="34" y="200" width="92" height="30" rx="4"/>
    <rect x="134" y="200" width="92" height="30" rx="4"/>
    <rect x="234" y="200" width="92" height="30" rx="4"/>
    <rect x="334" y="200" width="92" height="30" rx="4"/>
    <rect x="434" y="200" width="92" height="30" rx="4"/>
    <rect x="534" y="200" width="92" height="30" rx="4"/>
  </g>
  <g fill="#fbeef0" stroke="#9b1c31" stroke-width="1.5">
    <rect x="34" y="238" width="392" height="30" rx="4"/>
    <rect x="434" y="238" width="192" height="30" rx="4"/>
  </g>

  <!-- the class of every element -->
  <g font-family="Menlo, Consolas, 'Courier New', monospace" font-size="15" font-weight="bold" fill="#1b6ec2" text-anchor="middle">
    <text x="330" y="68">col-12</text>

    <text x="180" y="106">col-6</text>
    <text x="480" y="106">col-6</text>

    <text x="130" y="144">col-4</text>
    <text x="330" y="144">col-4</text>
    <text x="530" y="144">col-4</text>

    <text x="105" y="182">col-3</text>
    <text x="255" y="182">col-3</text>
    <text x="405" y="182">col-3</text>
    <text x="555" y="182">col-3</text>

    <text x="80" y="220">col-2</text>
    <text x="180" y="220">col-2</text>
    <text x="280" y="220">col-2</text>
    <text x="380" y="220">col-2</text>
    <text x="480" y="220">col-2</text>
    <text x="580" y="220">col-2</text>
  </g>
  <g font-family="Menlo, Consolas, 'Courier New', monospace" font-size="15" font-weight="bold" fill="#9b1c31" text-anchor="middle">
    <text x="230" y="258">col-8</text>
    <text x="530" y="258">col-4</text>
  </g>

  <!-- what the rows show -->
  <g font-size="17" fill="#333">
    <text x="652" y="69">the whole row: 12</text>
    <text x="652" y="107">two halves: 6 + 6</text>
    <text x="652" y="145">three thirds: 4 + 4 + 4</text>
    <text x="652" y="183">four quarters: 3 + 3 + 3 + 3</text>
    <text x="652" y="221">six sixths: 6 &#215; 2</text>
    <text x="652" y="259">unequal parts: 8 + 4</text>
  </g>
</svg>
