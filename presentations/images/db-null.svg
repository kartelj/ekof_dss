<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="167" viewBox="0 0 900 150" font-family="Arial, Helvetica, sans-serif">
  <!-- three fields of a film: a number, a text, and no value -->
  <g fill="#f1f1f1" stroke="#333" stroke-width="2">
    <rect x="10" y="4" width="180" height="32"/>
    <rect x="230" y="4" width="180" height="32"/>
    <rect x="450" y="4" width="180" height="32"/>
  </g>
  <g fill="#fff" stroke="#333" stroke-width="2">
    <rect x="10" y="36" width="180" height="46"/>
    <rect x="230" y="36" width="180" height="46"/>
  </g>
  <rect x="450" y="36" width="180" height="46" fill="#fbeef0" stroke="#9b1c31" stroke-width="2" stroke-dasharray="7 5"/>

  <g font-family="Menlo, Consolas, 'Courier New', monospace" text-anchor="middle">
    <g font-size="16" font-weight="bold" fill="#333">
      <text x="100" y="26">profit</text>
      <text x="320" y="26">states</text>
      <text x="540" y="26">year</text>
    </g>
    <g font-size="22">
      <text x="100" y="67" fill="#333">0</text>
      <text x="320" y="67" fill="#333">''</text>
      <text x="540" y="67" font-weight="bold" fill="#9b1c31">NULL</text>
    </g>
  </g>

  <g font-size="16" text-anchor="middle">
    <text x="100" y="110" font-weight="bold" fill="#2e7d32">a value</text>
    <text x="100" y="132" fill="#333">the number zero</text>
    <text x="320" y="110" font-weight="bold" fill="#2e7d32">a value</text>
    <text x="320" y="132" fill="#333">a text without characters</text>
    <text x="540" y="110" font-weight="bold" fill="#9b1c31">no value</text>
    <text x="540" y="132" fill="#333">the year is not known</text>
  </g>

  <!-- NULL in, NULL out -->
  <rect x="668" y="4" width="226" height="138" rx="10" fill="#fff" stroke="#9b1c31" stroke-width="2"/>
  <g font-family="Menlo, Consolas, 'Courier New', monospace" font-size="17" fill="#333">
    <text x="684" y="40">1 + NULL</text>
    <text x="684" y="80">NULL = NULL</text>
  </g>
  <g font-family="Menlo, Consolas, 'Courier New', monospace" font-size="17" font-weight="bold" fill="#9b1c31">
    <text x="830" y="40">NULL</text>
    <text x="830" y="80">NULL</text>
  </g>
  <g font-size="17" fill="#555">
    <text x="808" y="40">→</text>
    <text x="808" y="80">→</text>
  </g>
  <text x="781" y="124" text-anchor="middle" font-size="16" fill="#333">NULL in, NULL out</text>
</svg>
