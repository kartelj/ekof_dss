<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 350" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="12" refX="14" refY="6" orient="auto">
      <path d="M0,0 L16,6 L0,12 z" fill="#9b1c31"/>
    </marker>
    <marker id="arrow-inner" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="12" refX="12" refY="6" orient="auto">
      <path d="M0,0 L14,6 L0,12 z" fill="#555"/>
    </marker>
  </defs>

  <!-- the browser -->
  <rect x="10" y="8" width="200" height="334" rx="12" fill="#eef4fb" stroke="#1b6ec2" stroke-width="2"/>
  <text x="110" y="42" text-anchor="middle" font-size="24" font-weight="bold" fill="#1b6ec2">Browser</text>
  <g font-size="17" fill="#333" text-anchor="middle">
    <text x="110" y="122">an address is typed,</text>
    <text x="110" y="145">a link is clicked,</text>
    <text x="110" y="168">or a form is sent</text>
  </g>
  <rect x="55" y="190" width="110" height="62" rx="6" fill="#fff" stroke="#1b6ec2" stroke-width="2"/>
  <line x1="55" y1="206" x2="165" y2="206" stroke="#1b6ec2" stroke-width="2"/>
  <circle cx="65" cy="198" r="3" fill="#1b6ec2"/>
  <circle cx="76" cy="198" r="3" fill="#1b6ec2"/>
  <line x1="69" y1="219" x2="151" y2="219" stroke="#bbb" stroke-width="4"/>
  <line x1="69" y1="230" x2="133" y2="230" stroke="#bbb" stroke-width="4"/>
  <line x1="69" y1="241" x2="143" y2="241" stroke="#bbb" stroke-width="4"/>
  <text x="110" y="300" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">6. shows the page</text>

  <!-- the server -->
  <rect x="395" y="8" width="497" height="334" rx="12" fill="#fbeef0" stroke="#9b1c31" stroke-width="2"/>
  <text x="643" y="37" text-anchor="middle" font-size="22" font-weight="bold" fill="#9b1c31">Server: a Python program</text>

  <!-- Uvicorn and FastAPI -->
  <rect x="415" y="50" width="457" height="80" rx="8" fill="#fff" stroke="#9b1c31" stroke-width="2"/>
  <text x="431" y="75" font-size="19" font-weight="bold" fill="#9b1c31">2. Uvicorn and FastAPI</text>
  <text x="431" y="98" font-size="17" fill="#333">receive the request and find the function</text>
  <text x="431" y="119" font-size="17" fill="#333">for its method and address (the route)</text>

  <!-- our function -->
  <rect x="415" y="152" width="457" height="80" rx="8" fill="#fff" stroke="#2e7d32" stroke-width="2"/>
  <text x="431" y="177" font-size="19" font-weight="bold" fill="#2e7d32">3. Our function, written in Python</text>
  <text x="431" y="200" font-size="17" fill="#333">prepares the values that the page needs:</text>
  <text x="431" y="221" font-size="16" font-family="Menlo, Consolas, 'Courier New', monospace" fill="#333">{"current_count": 42}</text>

  <!-- the template -->
  <rect x="415" y="254" width="457" height="80" rx="8" fill="#fff" stroke="#b35900" stroke-width="2"/>
  <text x="431" y="279" font-size="19" font-weight="bold" fill="#b35900">4. Our template, filled by Jinja2</text>
  <text x="431" y="302" font-size="17" fill="#333">HTML with marked places for the values:</text>
  <text x="431" y="323" font-size="16" font-family="Menlo, Consolas, 'Courier New', monospace" fill="#333">&lt;p&gt;Current count: {{ current_count }}&lt;/p&gt;</text>

  <!-- inside the server: from one step to the next -->
  <line x1="643" y1="130" x2="643" y2="150" stroke="#555" stroke-width="2.5" marker-end="url(#arrow-inner)"/>
  <line x1="643" y1="232" x2="643" y2="252" stroke="#555" stroke-width="2.5" marker-end="url(#arrow-inner)"/>

  <!-- the request -->
  <line x1="212" y1="90" x2="413" y2="90" stroke="#9b1c31" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="302" y="74" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">1. HTTP request</text>
  <text x="302" y="114" text-anchor="middle" font-size="16" font-family="Menlo, Consolas, 'Courier New', monospace" fill="#333">GET /incrementer</text>

  <!-- the response -->
  <line x1="415" y1="294" x2="214" y2="294" stroke="#9b1c31" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="302" y="278" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">5. HTTP response</text>
  <text x="302" y="318" text-anchor="middle" font-size="16" font-family="Menlo, Consolas, 'Courier New', monospace" fill="#333">200 OK + HTML</text>
</svg>
