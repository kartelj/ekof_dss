<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 344" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <!-- The end of a relationship line in the crow's foot notation.
         The line comes from the left; the box of the entity begins at x = 0. -->
    <g id="one-and-only-one">
      <line x1="-12" y1="-11" x2="-12" y2="11"/>
      <line x1="-23" y1="-11" x2="-23" y2="11"/>
    </g>
    <g id="zero-or-many">
      <path d="M-20,0 L0,-12 M-20,0 L0,12" fill="none"/>
      <circle cx="-30" cy="0" r="7.5" fill="#fff"/>
    </g>
  </defs>

  <!-- table genre -->
  <rect x="20" y="58" width="220" height="113" rx="6" fill="#fff" stroke="#9b1c31" stroke-width="2"/>
  <path d="M20,94 V64 Q20,58 26,58 H234 Q240,58 240,64 V94 Z" fill="#fbeef0" stroke="#9b1c31" stroke-width="2"/>
  <text x="130" y="83" text-anchor="middle" font-size="19" font-weight="bold" fill="#9b1c31">genre</text>
  <g font-size="15" font-weight="bold">
    <text x="32" y="115" fill="#9b1c31">PK</text>
  </g>
  <g font-family="Menlo, Consolas, 'Courier New', monospace" font-size="16" fill="#333">
    <text x="76" y="115">genre_id</text>
    <text x="76" y="138">name</text>
    <text x="76" y="161">short_name</text>
  </g>

  <!-- table movie -->
  <rect x="335" y="12" width="230" height="320" rx="6" fill="#fff" stroke="#1b6ec2" stroke-width="2"/>
  <path d="M335,48 V18 Q335,12 341,12 H559 Q565,12 565,18 V48 Z" fill="#eef4fb" stroke="#1b6ec2" stroke-width="2"/>
  <text x="450" y="37" text-anchor="middle" font-size="19" font-weight="bold" fill="#1b6ec2">movie</text>
  <g font-size="15" font-weight="bold">
    <text x="347" y="69" fill="#9b1c31">PK</text>
    <text x="347" y="115" fill="#2e7d32">FK</text>
    <text x="347" y="161" fill="#2e7d32">FK</text>
  </g>
  <g font-family="Menlo, Consolas, 'Courier New', monospace" font-size="16" fill="#333">
    <text x="391" y="69">movie_id</text>
    <text x="391" y="92">title</text>
    <text x="391" y="115">genre_id</text>
    <text x="391" y="138">lasting</text>
    <text x="391" y="161">state_id</text>
    <text x="391" y="184">imdb_score</text>
    <text x="391" y="207">year</text>
    <text x="391" y="230">actors</text>
    <text x="391" y="253">directors</text>
    <text x="391" y="276">scenarists</text>
    <text x="391" y="299">plot</text>
    <text x="391" y="322">profit</text>
  </g>

  <!-- table state -->
  <rect x="660" y="104" width="220" height="113" rx="6" fill="#fff" stroke="#9b1c31" stroke-width="2"/>
  <path d="M660,140 V110 Q660,104 666,104 H874 Q880,104 880,110 V140 Z" fill="#fbeef0" stroke="#9b1c31" stroke-width="2"/>
  <text x="770" y="129" text-anchor="middle" font-size="19" font-weight="bold" fill="#9b1c31">state</text>
  <g font-size="15" font-weight="bold">
    <text x="672" y="161" fill="#9b1c31">PK</text>
  </g>
  <g font-family="Menlo, Consolas, 'Courier New', monospace" font-size="16" fill="#333">
    <text x="716" y="161">state_id</text>
    <text x="716" y="184">name</text>
    <text x="716" y="207">code</text>
  </g>

  <!-- the relationships: genre - movie and movie - state -->
  <g stroke="#333" stroke-width="2.5">
    <line x1="240" y1="109.5" x2="335" y2="109.5"/>
    <line x1="565" y1="155.5" x2="660" y2="155.5"/>
    <use href="#one-and-only-one" transform="translate(240,109.5) scale(-1,1)"/>
    <use href="#zero-or-many" transform="translate(335,109.5)"/>
    <use href="#zero-or-many" transform="translate(565,155.5) scale(-1,1)"/>
    <use href="#one-and-only-one" transform="translate(660,155.5)"/>
  </g>

  <!-- how to read the two lines -->
  <g font-size="16" fill="#333" text-anchor="middle">
    <text x="130" y="198">one genre has</text>
    <text x="130" y="218" font-weight="bold">zero or many films</text>
    <text x="130" y="246">one film has</text>
    <text x="130" y="266" font-weight="bold">one and only one genre</text>
    <text x="770" y="244">one state has</text>
    <text x="770" y="264" font-weight="bold">zero or many films</text>
    <text x="770" y="292">one film comes from</text>
    <text x="770" y="312" font-weight="bold">one and only one state</text>
  </g>

  <!-- legend -->
  <g font-size="15">
    <text x="20" y="304" font-weight="bold" fill="#9b1c31">PK</text>
    <text x="50" y="304" fill="#333">primary key</text>
    <text x="20" y="328" font-weight="bold" fill="#2e7d32">FK</text>
    <text x="50" y="328" fill="#333">foreign key</text>
  </g>
</svg>
