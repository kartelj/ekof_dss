<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 336" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="12" refX="12" refY="6" orient="auto">
      <path d="M0,0 L14,6 L0,12 z" fill="#555"/>
    </marker>
  </defs>

  <!-- the conditions, checked from the top -->
  <g fill="#eef4fb" stroke="#1b6ec2" stroke-width="2">
    <path d="M8,38 l18,-22 h248 l18,22 l-18,22 h-248 z"/>
    <path d="M8,112 l18,-22 h248 l18,22 l-18,22 h-248 z"/>
    <path d="M8,186 l18,-22 h248 l18,22 l-18,22 h-248 z"/>
  </g>
  <g font-family="Menlo, Consolas, 'Courier New', monospace" font-size="15" font-weight="bold" fill="#1b6ec2" text-anchor="middle">
    <text x="150" y="43">points &lt; 0 or points &gt; 100</text>
    <text x="150" y="117">points &gt;= 91</text>
    <text x="150" y="191">points &gt;= 81</text>
  </g>

  <!-- the blocks: only one of them is executed -->
  <g fill="#fbeef0" stroke="#9b1c31" stroke-width="2">
    <rect x="350" y="20" width="210" height="36" rx="6"/>
    <rect x="350" y="94" width="210" height="36" rx="6"/>
    <rect x="350" y="168" width="210" height="36" rx="6"/>
    <rect x="45" y="242" width="210" height="36" rx="6"/>
  </g>
  <g font-family="Menlo, Consolas, 'Courier New', monospace" font-size="15" fill="#333" text-anchor="middle">
    <text x="455" y="43">print("The ...")</text>
    <text x="455" y="117">print("Grade: 10")</text>
    <text x="455" y="191">print("Grade: 9")</text>
    <text x="150" y="265">print("Grade: 5 ...")</text>
  </g>
  <text x="38" y="265" text-anchor="end" font-family="Menlo, Consolas, 'Courier New', monospace" font-size="15" font-weight="bold" fill="#1b6ec2">else</text>

  <!-- True: to the block on the right -->
  <g stroke="#555" stroke-width="2" marker-end="url(#arrow)">
    <line x1="292" y1="38" x2="348" y2="38"/>
    <line x1="292" y1="112" x2="348" y2="112"/>
    <line x1="292" y1="186" x2="348" y2="186"/>
  </g>
  <g font-size="15" font-weight="bold" fill="#2e7d32" text-anchor="middle">
    <text x="320" y="31">True</text>
    <text x="320" y="105">True</text>
    <text x="320" y="179">True</text>
  </g>

  <!-- False: down to the next condition -->
  <line x1="150" y1="0" x2="150" y2="14" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <g stroke="#555" stroke-width="2" marker-end="url(#arrow)">
    <line x1="150" y1="60" x2="150" y2="88"/>
    <line x1="150" y1="134" x2="150" y2="162"/>
    <line x1="150" y1="208" x2="150" y2="240"/>
  </g>
  <g font-size="15" font-weight="bold" fill="#9b1c31">
    <text x="160" y="80">False</text>
    <text x="160" y="154">False</text>
    <text x="160" y="229">False</text>
  </g>
  <text x="215" y="229" font-size="15" font-style="italic" fill="#555">(... the other elif)</text>

  <!-- all the paths meet after the if statement -->
  <g stroke="#555" stroke-width="2" fill="none">
    <polyline points="560,38 584,38 584,316"/>
    <line x1="560" y1="112" x2="584" y2="112"/>
    <line x1="560" y1="186" x2="584" y2="186"/>
  </g>
  <line x1="584" y1="316" x2="562" y2="316" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="150" y1="278" x2="150" y2="296" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="45" y="298" width="515" height="36" rx="6" fill="#fff" stroke="#555" stroke-width="2"/>
  <text x="302" y="321" text-anchor="middle" font-size="16" fill="#333">the program goes on after the if statement</text>
</svg>
