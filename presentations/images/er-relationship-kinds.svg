<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 312" font-family="Arial, Helvetica, sans-serif">
  <!-- three panels: which instances of two entities are connected -->
  <g fill="#fff" stroke="#ccc" stroke-width="1.5">
    <rect x="2" y="2" width="236" height="308" rx="10"/>
    <rect x="248" y="2" width="282" height="308" rx="10"/>
    <rect x="540" y="2" width="358" height="308" rx="10"/>
  </g>
  <g font-size="19" font-weight="bold" fill="#333" text-anchor="middle">
    <text x="120" y="30">one-to-one</text>
    <text x="389" y="30">one-to-many</text>
    <text x="719" y="30">many-to-many</text>
  </g>
  <g font-size="15" fill="#555" text-anchor="middle">
    <text x="57" y="58">country</text>
    <text x="182" y="58">capital city</text>
    <text x="285" y="58">country</text>
    <text x="458" y="58">actor</text>
    <text x="616" y="58">film</text>
    <text x="826" y="58">actor</text>
  </g>

  <!-- the connections -->
  <g stroke="#333" stroke-width="2.5">
    <line x1="102" y1="88" x2="137" y2="88"/>
    <line x1="102" y1="128" x2="137" y2="128"/>
    <line x1="102" y1="168" x2="137" y2="168"/>
    <line x1="102" y1="208" x2="137" y2="208"/>

    <line x1="310" y1="124" x2="398" y2="84"/>
    <line x1="310" y1="124" x2="398" y2="124"/>
    <line x1="310" y1="124" x2="398" y2="164"/>
    <line x1="310" y1="204" x2="398" y2="204"/>
    <line x1="310" y1="244" x2="398" y2="244"/>

    <line x1="686" y1="104" x2="758" y2="84"/>
    <line x1="686" y1="104" x2="758" y2="134"/>
    <line x1="686" y1="164" x2="758" y2="134"/>
    <line x1="686" y1="164" x2="758" y2="184"/>
    <line x1="686" y1="224" x2="758" y2="184"/>
    <line x1="686" y1="224" x2="758" y2="234"/>
  </g>

  <!-- the instances: blue on the left, orange on the right -->
  <g fill="#eef4fb" stroke="#1b6ec2" stroke-width="2">
    <rect x="12" y="74" width="90" height="28" rx="14"/>
    <rect x="12" y="114" width="90" height="28" rx="14"/>
    <rect x="12" y="154" width="90" height="28" rx="14"/>
    <rect x="12" y="194" width="90" height="28" rx="14"/>

    <rect x="260" y="110" width="50" height="28" rx="14"/>
    <rect x="260" y="190" width="50" height="28" rx="14"/>
    <rect x="260" y="230" width="50" height="28" rx="14"/>
    <rect x="260" y="270" width="50" height="28" rx="14"/>

    <rect x="548" y="90" width="138" height="28" rx="14"/>
    <rect x="548" y="150" width="138" height="28" rx="14"/>
    <rect x="548" y="210" width="138" height="28" rx="14"/>
  </g>
  <g fill="#fdf3e7" stroke="#b35900" stroke-width="2">
    <rect x="137" y="74" width="92" height="28" rx="14"/>
    <rect x="137" y="114" width="92" height="28" rx="14"/>
    <rect x="137" y="154" width="92" height="28" rx="14"/>
    <rect x="137" y="194" width="92" height="28" rx="14"/>

    <rect x="398" y="70" width="120" height="28" rx="14"/>
    <rect x="398" y="110" width="120" height="28" rx="14"/>
    <rect x="398" y="150" width="120" height="28" rx="14"/>
    <rect x="398" y="190" width="120" height="28" rx="14"/>
    <rect x="398" y="230" width="120" height="28" rx="14"/>

    <rect x="758" y="70" width="132" height="28" rx="14"/>
    <rect x="758" y="120" width="132" height="28" rx="14"/>
    <rect x="758" y="170" width="132" height="28" rx="14"/>
    <rect x="758" y="220" width="132" height="28" rx="14"/>
  </g>
  <g font-size="15" fill="#333" text-anchor="middle">
    <text x="57" y="93">Serbia</text>
    <text x="57" y="133">Italy</text>
    <text x="57" y="173">France</text>
    <text x="57" y="213">Australia</text>
    <text x="183" y="93">Belgrade</text>
    <text x="183" y="133">Rome</text>
    <text x="183" y="173">Paris</text>
    <text x="183" y="213">Canberra</text>

    <text x="285" y="129">US</text>
    <text x="285" y="209">RS</text>
    <text x="285" y="249">AU</text>
    <text x="285" y="289">IT</text>
    <text x="458" y="89">Roberts</text>
    <text x="458" y="129">De Niro</text>
    <text x="458" y="169">Pacino</text>
    <text x="458" y="209">Živojinović</text>
    <text x="458" y="249">Kidman</text>

    <text x="617" y="109">Raising Arizona</text>
    <text x="617" y="169">The Big Lebowski</text>
    <text x="617" y="229">Fargo</text>
    <text x="824" y="89">Nicolas Cage</text>
    <text x="824" y="139">John Goodman</text>
    <text x="824" y="189">Steve Buscemi</text>
    <text x="824" y="239">William H. Macy</text>
  </g>

  <!-- what the pictures say -->
  <g font-size="15" fill="#555">
    <text x="120" y="262" text-anchor="middle">each country has</text>
    <text x="120" y="282" text-anchor="middle">exactly one capital</text>
    <text x="322" y="289">no actor from Italy</text>
    <text x="719" y="276" text-anchor="middle">a film has many actors,</text>
    <text x="719" y="296" text-anchor="middle">an actor plays in many films</text>
  </g>
</svg>
