<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="12" refX="12" refY="6" orient="auto">
      <path d="M0,0 L14,6 L0,12 z" fill="#555"/>
    </marker>
  </defs>

  <g font-size="19" font-weight="bold" text-anchor="middle">
    <text x="170" y="22" fill="#1b6ec2">In the program</text>
    <text x="730" y="22" fill="#9b1c31">In the database</text>
    <text x="450" y="22" fill="#333">SQLModel</text>
  </g>

  <!-- the class Actor -->
  <rect x="10" y="36" width="320" height="182" rx="6" fill="#fff" stroke="#1b6ec2" stroke-width="2"/>
  <path d="M10,70 V42 Q10,36 16,36 H324 Q330,36 330,42 V70 Z" fill="#eef4fb" stroke="#1b6ec2" stroke-width="2"/>
  <text x="24" y="59" font-family="Menlo, Consolas, 'Courier New', monospace" font-size="17" font-weight="bold" fill="#1b6ec2">class Actor</text>
  <g font-family="Menlo, Consolas, 'Courier New', monospace" font-size="15" fill="#333">
    <text x="24" y="92">actor_id: int | None</text>
    <text x="24" y="116">last_name: str</text>
    <text x="24" y="140">first_name: str</text>
    <text x="24" y="164">country_code: str | None</text>
    <text x="24" y="188">date_of_birth: date | None</text>
    <text x="24" y="212">created_at: datetime | None</text>
  </g>

  <!-- the table actor -->
  <rect x="570" y="36" width="320" height="182" rx="6" fill="#fff" stroke="#9b1c31" stroke-width="2"/>
  <path d="M570,70 V42 Q570,36 576,36 H884 Q890,36 890,42 V70 Z" fill="#fbeef0" stroke="#9b1c31" stroke-width="2"/>
  <text x="584" y="59" font-family="Menlo, Consolas, 'Courier New', monospace" font-size="17" font-weight="bold" fill="#9b1c31">table actor</text>
  <text x="584" y="92" font-size="14" font-weight="bold" fill="#9b1c31">PK</text>
  <g font-family="Menlo, Consolas, 'Courier New', monospace" font-size="15" fill="#333">
    <text x="612" y="92">actor_id INTEGER</text>
    <text x="612" y="116">last_name VARCHAR NOT NULL</text>
    <text x="612" y="140">first_name VARCHAR NOT NULL</text>
    <text x="612" y="164">country_code VARCHAR</text>
    <text x="612" y="188">date_of_birth DATE</text>
    <text x="612" y="212">created_at DATETIME</text>
  </g>

  <!-- every attribute is a column -->
  <g stroke="#bbb" stroke-width="1.5" stroke-dasharray="4 4">
    <line x1="334" y1="111" x2="566" y2="111"/>
    <line x1="334" y1="135" x2="566" y2="135"/>
    <line x1="334" y1="159" x2="566" y2="159"/>
    <line x1="334" y1="183" x2="566" y2="183"/>
    <line x1="334" y1="207" x2="566" y2="207"/>
  </g>
  <rect x="362" y="74" width="176" height="28" rx="6" fill="#fff"/>
  <line x1="334" y1="53" x2="566" y2="53" stroke="#555" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="450" y="45" text-anchor="middle" font-size="15" fill="#333">create_all(): CREATE TABLE</text>
  <text x="450" y="94" text-anchor="middle" font-size="15" fill="#555">an attribute is a column</text>

  <!-- an object is a row -->
  <rect x="10" y="244" width="320" height="86" rx="10" fill="#eef4fb" stroke="#1b6ec2" stroke-width="2"/>
  <g font-family="Menlo, Consolas, 'Courier New', monospace" font-size="15" fill="#333">
    <text x="24" y="270">Actor(actor_id=1,</text>
    <text x="78" y="294">last_name="De Niro",</text>
    <text x="78" y="318">first_name="Robert", ...)</text>
  </g>

  <rect x="570" y="268" width="320" height="34" fill="#fbeef0" stroke="#9b1c31" stroke-width="2"/>
  <g stroke="#9b1c31" stroke-width="1">
    <line x1="600" y1="268" x2="600" y2="302"/>
    <line x1="680" y1="268" x2="680" y2="302"/>
    <line x1="750" y1="268" x2="750" y2="302"/>
    <line x1="790" y1="268" x2="790" y2="302"/>
  </g>
  <g font-size="15" fill="#333">
    <text x="580" y="290">1</text>
    <text x="608" y="290">De Niro</text>
    <text x="688" y="290">Robert</text>
    <text x="758" y="290">US</text>
    <text x="798" y="290">1943-08-17</text>
  </g>
  <text x="730" y="326" text-anchor="middle" font-size="15" fill="#555">a row of the table</text>

  <line x1="334" y1="270" x2="566" y2="270" stroke="#555" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="450" y="262" text-anchor="middle" font-size="15" fill="#333">add, commit: INSERT</text>
  <line x1="566" y1="300" x2="334" y2="300" stroke="#555" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="450" y="322" text-anchor="middle" font-size="15" fill="#333">exec(select(Actor)): SELECT</text>
</svg>
