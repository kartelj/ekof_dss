<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 372" font-family="Arial, Helvetica, sans-serif">
  <!-- the table genre (three of its rows) -->
  <text x="40" y="22" font-size="18" font-weight="bold" fill="#1b6ec2">genre</text>
  <rect x="40" y="30" width="240" height="26" fill="#eef4fb"/>
  <rect x="40" y="30" width="240" height="104" fill="none" stroke="#1b6ec2" stroke-width="2"/>
  <g stroke="#1b6ec2" stroke-width="1">
    <line x1="40" y1="56" x2="280" y2="56"/>
    <line x1="40" y1="82" x2="280" y2="82"/>
    <line x1="40" y1="108" x2="280" y2="108"/>
    <line x1="130" y1="30" x2="130" y2="134"/>
  </g>
  <g font-size="15" fill="#333">
    <text x="48" y="48" font-weight="bold">genre_id</text>
    <text x="138" y="48" font-weight="bold">name</text>
    <text x="48" y="74">5</text>
    <text x="138" y="74">comedy</text>
    <text x="48" y="100">6</text>
    <text x="138" y="100">fantasy</text>
    <text x="48" y="126">7</text>
    <text x="138" y="126">science fiction</text>
  </g>

  <!-- the table movie (the films of these genres) -->
  <text x="540" y="22" font-size="18" font-weight="bold" fill="#9b1c31">movie</text>
  <rect x="540" y="30" width="340" height="26" fill="#fbeef0"/>
  <rect x="540" y="30" width="340" height="130" fill="none" stroke="#9b1c31" stroke-width="2"/>
  <g stroke="#9b1c31" stroke-width="1">
    <line x1="540" y1="56" x2="880" y2="56"/>
    <line x1="540" y1="82" x2="880" y2="82"/>
    <line x1="540" y1="108" x2="880" y2="108"/>
    <line x1="540" y1="134" x2="880" y2="134"/>
    <line x1="790" y1="30" x2="790" y2="160"/>
  </g>
  <g font-size="15" fill="#333">
    <text x="548" y="48" font-weight="bold">title</text>
    <text x="798" y="48" font-weight="bold">genre_id</text>
    <text x="548" y="74">O Brother, Where Art Thou?</text>
    <text x="798" y="74">5</text>
    <text x="548" y="100">Delicatessen</text>
    <text x="798" y="100">5</text>
    <text x="548" y="126">Who's Singin' Over There?</text>
    <text x="798" y="126">5</text>
    <text x="548" y="152">The City of Lost Children</text>
    <text x="798" y="152">6</text>
  </g>

  <!-- which rows belong together: genre.genre_id = movie.genre_id -->
  <g stroke-width="2.5" fill="none">
    <line x1="280" y1="69" x2="540" y2="69" stroke="#1b6ec2"/>
    <line x1="280" y1="69" x2="540" y2="95" stroke="#1b6ec2"/>
    <line x1="280" y1="69" x2="540" y2="121" stroke="#1b6ec2"/>
    <line x1="280" y1="95" x2="540" y2="147" stroke="#2e7d32"/>
    <line x1="280" y1="121" x2="318" y2="121" stroke="#b35900" stroke-dasharray="6 4"/>
    <path d="M318,114 l14,14 M332,114 l-14,14" stroke="#b35900"/>
  </g>
  <text x="40" y="158" font-size="15" fill="#b35900">no film has the genre_id 7</text>

  <!-- the result of INNER JOIN -->
  <text x="40" y="196" font-size="17" font-weight="bold" fill="#333">INNER JOIN - only the pairs that match</text>
  <rect x="40" y="204" width="380" height="26" fill="#f1f1f1"/>
  <rect x="40" y="204" width="380" height="130" fill="none" stroke="#333" stroke-width="2"/>
  <g stroke="#333" stroke-width="1">
    <line x1="40" y1="230" x2="420" y2="230"/>
    <line x1="40" y1="256" x2="420" y2="256"/>
    <line x1="40" y1="282" x2="420" y2="282"/>
    <line x1="40" y1="308" x2="420" y2="308"/>
    <line x1="190" y1="204" x2="190" y2="334"/>
  </g>
  <g font-size="15" fill="#333">
    <text x="48" y="222" font-weight="bold">name</text>
    <text x="198" y="222" font-weight="bold">title</text>
    <text x="48" y="248">comedy</text>
    <text x="198" y="248">O Brother, Where Art Thou?</text>
    <text x="48" y="274">comedy</text>
    <text x="198" y="274">Delicatessen</text>
    <text x="48" y="300">comedy</text>
    <text x="198" y="300">Who's Singin' Over There?</text>
    <text x="48" y="326">fantasy</text>
    <text x="198" y="326">The City of Lost Children</text>
  </g>

  <!-- the result of LEFT JOIN -->
  <text x="480" y="196" font-size="17" font-weight="bold" fill="#333">LEFT JOIN - and the genre without films</text>
  <rect x="480" y="204" width="380" height="26" fill="#f1f1f1"/>
  <rect x="480" y="334" width="380" height="26" fill="#fbeef0"/>
  <rect x="480" y="204" width="380" height="156" fill="none" stroke="#333" stroke-width="2"/>
  <g stroke="#333" stroke-width="1">
    <line x1="480" y1="230" x2="860" y2="230"/>
    <line x1="480" y1="256" x2="860" y2="256"/>
    <line x1="480" y1="282" x2="860" y2="282"/>
    <line x1="480" y1="308" x2="860" y2="308"/>
    <line x1="480" y1="334" x2="860" y2="334"/>
    <line x1="630" y1="204" x2="630" y2="360"/>
  </g>
  <g font-size="15" fill="#333">
    <text x="488" y="222" font-weight="bold">name</text>
    <text x="638" y="222" font-weight="bold">title</text>
    <text x="488" y="248">comedy</text>
    <text x="638" y="248">O Brother, Where Art Thou?</text>
    <text x="488" y="274">comedy</text>
    <text x="638" y="274">Delicatessen</text>
    <text x="488" y="300">comedy</text>
    <text x="638" y="300">Who's Singin' Over There?</text>
    <text x="488" y="326">fantasy</text>
    <text x="638" y="326">The City of Lost Children</text>
    <text x="488" y="352" font-weight="bold" fill="#9b1c31">science fiction</text>
    <text x="638" y="352" font-weight="bold" fill="#9b1c31">NULL</text>
  </g>
</svg>
