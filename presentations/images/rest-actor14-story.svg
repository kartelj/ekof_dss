<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 412" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="http-end" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="12" refX="12" refY="6" orient="auto">
      <path d="M0,0 L16,6 L0,12 z" fill="#9b1c31"/>
    </marker>
    <marker id="answer-end" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="12" refX="12" refY="6" orient="auto">
      <path d="M0,0 L14,6 L0,12 z" fill="#555"/>
    </marker>
  </defs>

  <!-- the two programs and their time lines -->
  <rect x="30" y="10" width="140" height="40" rx="8" fill="#eef4fb" stroke="#1b6ec2" stroke-width="2"/>
  <text x="100" y="37" text-anchor="middle" font-size="19" font-weight="bold" fill="#1b6ec2">Client</text>
  <rect x="410" y="10" width="140" height="40" rx="8" fill="#fbeef0" stroke="#9b1c31" stroke-width="2"/>
  <text x="480" y="37" text-anchor="middle" font-size="19" font-weight="bold" fill="#9b1c31">Service</text>
  <line x1="100" y1="50" x2="100" y2="408" stroke="#bbb" stroke-width="2" stroke-dasharray="6,5"/>
  <line x1="480" y1="50" x2="480" y2="408" stroke="#bbb" stroke-width="2" stroke-dasharray="6,5"/>

  <!-- the table actor -->
  <path d="M612,18 v22 a14,5 0 0 0 28,0 v-22" fill="#f1f1f1" stroke="#2e7d32" stroke-width="2"/>
  <ellipse cx="626" cy="18" rx="14" ry="5" fill="#f1f1f1" stroke="#2e7d32" stroke-width="2"/>
  <text x="652" y="37" font-size="19" font-weight="bold" fill="#2e7d32">The table actor</text>

  <g font-size="15" font-family="Menlo, Consolas, 'Courier New', monospace" fill="#333">
    <!-- 1. create -->
    <text x="115" y="84">POST /api/actors<tspan font-family="Arial, Helvetica, sans-serif" fill="#555">  Streep Meril</tspan></text>
    <line x1="100" y1="92" x2="478" y2="92" stroke="#9b1c31" stroke-width="2.5" marker-end="url(#http-end)"/>
    <line x1="480" y1="124" x2="102" y2="124" stroke="#555" stroke-width="2" stroke-dasharray="7,4" marker-end="url(#answer-end)"/>
    <text x="115" y="116"><tspan fill="#2e7d32" font-weight="bold">201 Created</tspan>  Location: /api/actors/14</text>

    <!-- 2. invalid data -->
    <text x="115" y="152">POST /api/actors<tspan font-family="Arial, Helvetica, sans-serif" fill="#555">  with "country_id": "USA"</tspan></text>
    <line x1="100" y1="160" x2="478" y2="160" stroke="#9b1c31" stroke-width="2.5" marker-end="url(#http-end)"/>
    <line x1="480" y1="192" x2="102" y2="192" stroke="#555" stroke-width="2" stroke-dasharray="7,4" marker-end="url(#answer-end)"/>
    <text x="115" y="184"><tspan fill="#9b1c31" font-weight="bold">422 Unprocessable Content</tspan></text>

    <!-- 3. update -->
    <text x="115" y="220">PUT /api/actors/14<tspan font-family="Arial, Helvetica, sans-serif" fill="#555">  Streep Meryl</tspan></text>
    <line x1="100" y1="228" x2="478" y2="228" stroke="#9b1c31" stroke-width="2.5" marker-end="url(#http-end)"/>
    <line x1="480" y1="260" x2="102" y2="260" stroke="#555" stroke-width="2" stroke-dasharray="7,4" marker-end="url(#answer-end)"/>
    <text x="115" y="252"><tspan fill="#2e7d32" font-weight="bold">204 No Content</tspan></text>

    <!-- 4. delete -->
    <text x="115" y="288">DELETE /api/actors/14</text>
    <line x1="100" y1="296" x2="478" y2="296" stroke="#9b1c31" stroke-width="2.5" marker-end="url(#http-end)"/>
    <line x1="480" y1="328" x2="102" y2="328" stroke="#555" stroke-width="2" stroke-dasharray="7,4" marker-end="url(#answer-end)"/>
    <text x="115" y="320"><tspan fill="#2e7d32" font-weight="bold">204 No Content</tspan></text>

    <!-- 5. the same delete again -->
    <text x="115" y="356">DELETE /api/actors/14<tspan font-family="Arial, Helvetica, sans-serif" fill="#555">  once more</tspan></text>
    <line x1="100" y1="364" x2="478" y2="364" stroke="#9b1c31" stroke-width="2.5" marker-end="url(#http-end)"/>
    <line x1="480" y1="396" x2="102" y2="396" stroke="#555" stroke-width="2" stroke-dasharray="7,4" marker-end="url(#answer-end)"/>
    <text x="115" y="388"><tspan fill="#9b1c31" font-weight="bold">404 Not Found</tspan></text>
  </g>

  <!-- the state of the table after each exchange -->
  <g font-size="16" fill="#333">
    <!-- 1: a new row -->
    <rect x="612" y="91" width="50" height="34" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
    <rect x="662" y="91" width="105" height="34" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
    <rect x="767" y="91" width="105" height="34" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
    <text x="637" y="114" text-anchor="middle">14</text>
    <text x="714" y="114" text-anchor="middle">Streep</text>
    <text x="819" y="114" text-anchor="middle">Meril</text>
    <text x="612" y="81" font-size="15" fill="#2e7d32">a new row</text>

    <!-- 2: nothing is saved -->
    <text x="612" y="182" fill="#555">no change - nothing is saved</text>

    <!-- 3: one value is changed -->
    <rect x="612" y="227" width="50" height="34" fill="#fff" stroke="#999" stroke-width="2"/>
    <rect x="662" y="227" width="105" height="34" fill="#fff" stroke="#999" stroke-width="2"/>
    <rect x="767" y="227" width="105" height="34" fill="#fdf3e8" stroke="#b35900" stroke-width="2"/>
    <text x="637" y="250" text-anchor="middle">14</text>
    <text x="714" y="250" text-anchor="middle">Streep</text>
    <text x="819" y="250" text-anchor="middle" font-weight="bold" fill="#b35900">Meryl</text>
    <text x="612" y="217" font-size="15" fill="#b35900">the first name is changed</text>

    <!-- 4: the row is gone -->
    <text x="612" y="318" fill="#9b1c31">row 14 is deleted</text>

    <!-- 5: still gone -->
    <text x="612" y="386" fill="#555">no change - there is no row 14</text>
  </g>
</svg>
