<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 338" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arrow-France" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="12" refX="12" refY="6" orient="auto">
      <path d="M0,0 L14,6 L0,12 z" fill="#1b6ec2"/>
    </marker>
    <marker id="arrow-USA" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="12" refX="12" refY="6" orient="auto">
      <path d="M0,0 L14,6 L0,12 z" fill="#9b1c31"/>
    </marker>
    <marker id="arrow-Yugoslavia" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="12" refX="12" refY="6" orient="auto">
      <path d="M0,0 L14,6 L0,12 z" fill="#2e7d32"/>
    </marker>
  </defs>

  <!-- the rows of movie, put into one group for every value of states -->
  <text x="20" y="26" font-size="17" font-weight="bold" fill="#333">the rows, in groups by <tspan font-family="Menlo, Consolas, 'Courier New', monospace">states</tspan></text>
  <rect x="20" y="44" width="380" height="26" fill="#f1f1f1" stroke="#333" stroke-width="2"/>
  <g font-size="15" font-weight="bold" fill="#333">
    <text x="27" y="62">title</text>
    <text x="242" y="62">states</text>
    <text x="337" y="62">lasting</text>
  </g>
  <rect x="20" y="70" width="380" height="72" fill="#eef4fb"/>
  <g stroke="#1b6ec2" stroke-width="1">
    <line x1="20" y1="94" x2="400" y2="94"/>
    <line x1="20" y1="118" x2="400" y2="118"/>
    <line x1="235" y1="70" x2="235" y2="142"/>
    <line x1="330" y1="70" x2="330" y2="142"/>
  </g>
  <rect x="20" y="70" width="380" height="72" fill="none" stroke="#1b6ec2" stroke-width="2.5"/>
  <g font-size="15" fill="#333">
    <text x="27" y="87">Amélie</text>
    <text x="242" y="87" font-weight="bold" fill="#1b6ec2">France</text>
    <text x="337" y="87">122</text>
    <text x="27" y="111">Delicatessen</text>
    <text x="242" y="111" font-weight="bold" fill="#1b6ec2">France</text>
    <text x="337" y="111">99</text>
    <text x="27" y="135">The City of Lost Children</text>
    <text x="242" y="135" font-weight="bold" fill="#1b6ec2">France</text>
    <text x="337" y="135">112</text>
  </g>
  <rect x="20" y="152" width="380" height="144" fill="#fbeef0"/>
  <g stroke="#9b1c31" stroke-width="1">
    <line x1="20" y1="176" x2="400" y2="176"/>
    <line x1="20" y1="200" x2="400" y2="200"/>
    <line x1="20" y1="224" x2="400" y2="224"/>
    <line x1="20" y1="248" x2="400" y2="248"/>
    <line x1="20" y1="272" x2="400" y2="272"/>
    <line x1="235" y1="152" x2="235" y2="296"/>
    <line x1="330" y1="152" x2="330" y2="296"/>
  </g>
  <rect x="20" y="152" width="380" height="144" fill="none" stroke="#9b1c31" stroke-width="2.5"/>
  <g font-size="15" fill="#333">
    <text x="27" y="169">Raising Arizona</text>
    <text x="242" y="169" font-weight="bold" fill="#9b1c31">USA</text>
    <text x="337" y="169">94</text>
    <text x="27" y="193">Miller&#x27;s Crossing</text>
    <text x="242" y="193" font-weight="bold" fill="#9b1c31">USA</text>
    <text x="337" y="193">115</text>
    <text x="27" y="217">Fargo</text>
    <text x="242" y="217" font-weight="bold" fill="#9b1c31">USA</text>
    <text x="337" y="217">98</text>
    <text x="27" y="241">The Big Lebowski</text>
    <text x="242" y="241" font-weight="bold" fill="#9b1c31">USA</text>
    <text x="337" y="241">117</text>
    <text x="27" y="265">O Brother, Where Art Thou?</text>
    <text x="242" y="265" font-weight="bold" fill="#9b1c31">USA</text>
    <text x="337" y="265">107</text>
    <text x="27" y="289">No Country for Old Men</text>
    <text x="242" y="289" font-weight="bold" fill="#9b1c31">USA</text>
    <text x="337" y="289">122</text>
  </g>
  <rect x="20" y="306" width="380" height="24" fill="#edf6ee"/>
  <g stroke="#2e7d32" stroke-width="1">
    <line x1="235" y1="306" x2="235" y2="330"/>
    <line x1="330" y1="306" x2="330" y2="330"/>
  </g>
  <rect x="20" y="306" width="380" height="24" fill="none" stroke="#2e7d32" stroke-width="2.5"/>
  <g font-size="15" fill="#333">
    <text x="27" y="323">Who&#x27;s Singin&#x27; Over There?</text>
    <text x="242" y="323" font-weight="bold" fill="#2e7d32">Yugoslavia</text>
    <text x="337" y="323">86</text>
  </g>

  <!-- the result: one row for every group -->
  <text x="560" y="136" font-size="17" font-weight="bold" fill="#333">one row for every group</text>
  <rect x="560" y="150" width="330" height="26" fill="#f1f1f1"/>
  <rect x="560" y="150" width="330" height="98" fill="none" stroke="#333" stroke-width="2"/>
  <g stroke="#333" stroke-width="1">
    <line x1="560" y1="176" x2="890" y2="176"/>
    <line x1="560" y1="200" x2="890" y2="200"/>
    <line x1="560" y1="224" x2="890" y2="224"/>
    <line x1="665" y1="150" x2="665" y2="248"/>
    <line x1="720" y1="150" x2="720" y2="248"/>
  </g>
  <g font-size="15" fill="#333">
    <text x="567" y="168" font-weight="bold">states</text>
    <text x="672" y="168" font-weight="bold">films</text>
    <text x="727" y="168" font-weight="bold">average_lasting</text>
    <text x="567" y="193" font-weight="bold" fill="#1b6ec2">France</text>
    <text x="672" y="193">3</text>
    <text x="727" y="193">111.0</text>
    <text x="567" y="217" font-weight="bold" fill="#9b1c31">USA</text>
    <text x="672" y="217">6</text>
    <text x="727" y="217">108.83333333333333</text>
    <text x="567" y="241" font-weight="bold" fill="#2e7d32">Yugoslavia</text>
    <text x="672" y="241">1</text>
    <text x="727" y="241">86.0</text>
  </g>
  <path d="M406,106.0 C480,106.0 480,188.0 556,188.0" fill="none" stroke="#1b6ec2" stroke-width="2.5" marker-end="url(#arrow-France)"/>
  <path d="M406,224.0 C480,224.0 480,212.0 556,212.0" fill="none" stroke="#9b1c31" stroke-width="2.5" marker-end="url(#arrow-USA)"/>
  <path d="M406,318.0 C480,318.0 480,236.0 556,236.0" fill="none" stroke="#2e7d32" stroke-width="2.5" marker-end="url(#arrow-Yugoslavia)"/>
  <g font-size="15" fill="#555">
    <text x="560" y="278"><tspan font-family="Menlo, Consolas, 'Courier New', monospace">COUNT(*)</tspan> counts the rows of the group,</text>
    <text x="560" y="300"><tspan font-family="Menlo, Consolas, 'Courier New', monospace">AVG(lasting)</tspan> is their average lasting</text>
  </g>
</svg>
