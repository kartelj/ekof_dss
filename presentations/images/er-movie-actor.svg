<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 328" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <!-- The end of a relationship line in the crow's foot notation.
         The line comes from the left; the box of the entity begins at x = 0. -->
    <g id="one-and-only-one">
      <line x1="-12" y1="-11" x2="-12" y2="11"/>
      <line x1="-23" y1="-11" x2="-23" y2="11"/>
    </g>
    <g id="zero-or-many">
      <path d="M-20,0 L0,-12 M-20,0 L0,12" fill="none"/>
      <circle cx="-30" cy="0" r="7.5" fill="#fff"/>
    </g>
  </defs>

  <!-- the logical model: a many-to-many relationship, drawn directly -->
  <text x="20" y="24" font-size="18" font-weight="bold" fill="#555">Logical model</text>
  <!-- entity actor -->
  <rect x="150" y="36" width="200" height="90" rx="6" fill="#fff" stroke="#1b6ec2" stroke-width="2"/>
  <path d="M150,72 V42 Q150,36 156,36 H344 Q350,36 350,42 V72 Z" fill="#eef4fb" stroke="#1b6ec2" stroke-width="2"/>
  <text x="250" y="61" text-anchor="middle" font-size="19" font-weight="bold" fill="#1b6ec2">actor</text>
  <g font-family="Menlo, Consolas, 'Courier New', monospace" font-size="16" fill="#333">
    <text x="162" y="93">last_name</text>
    <text x="162" y="116">first_name</text>
  </g>
  <!-- entity movie -->
  <rect x="550" y="36" width="200" height="90" rx="6" fill="#fff" stroke="#1b6ec2" stroke-width="2"/>
  <path d="M550,72 V42 Q550,36 556,36 H744 Q750,36 750,42 V72 Z" fill="#eef4fb" stroke="#1b6ec2" stroke-width="2"/>
  <text x="650" y="61" text-anchor="middle" font-size="19" font-weight="bold" fill="#1b6ec2">movie</text>
  <g font-family="Menlo, Consolas, 'Courier New', monospace" font-size="16" fill="#333">
    <text x="562" y="93">title</text>
    <text x="562" y="116">year</text>
  </g>
  <g stroke="#333" stroke-width="2.5">
    <line x1="350" y1="81" x2="550" y2="81"/>
    <use href="#zero-or-many" transform="translate(350,81) scale(-1,1)"/>
    <use href="#zero-or-many" transform="translate(550,81)"/>
  </g>
  <text x="450" y="67" text-anchor="middle" font-size="17" font-style="italic" fill="#333">plays in</text>

  <!-- the physical model: the relationship has become a table with two foreign keys -->
  <line x1="20" y1="142" x2="880" y2="142" stroke="#ddd" stroke-width="1.5"/>
  <text x="20" y="167" font-size="18" font-weight="bold" fill="#555">Physical model</text>
  <!-- table actor -->
  <rect x="20" y="203" width="230" height="113" rx="6" fill="#fff" stroke="#1b6ec2" stroke-width="2"/>
  <path d="M20,239 V209 Q20,203 26,203 H244 Q250,203 250,209 V239 Z" fill="#eef4fb" stroke="#1b6ec2" stroke-width="2"/>
  <text x="135" y="228" text-anchor="middle" font-size="19" font-weight="bold" fill="#1b6ec2">actor</text>
  <g font-size="15" font-weight="bold">
    <text x="32" y="260" fill="#9b1c31">PK</text>
  </g>
  <g font-family="Menlo, Consolas, 'Courier New', monospace" font-size="16" fill="#333">
    <text x="76" y="260">actor_id</text>
    <text x="76" y="283">last_name</text>
    <text x="76" y="306">first_name</text>
  </g>

  <!-- the junction table movie_actor -->
  <rect x="335" y="180" width="230" height="113" rx="6" fill="#fff" stroke="#9b1c31" stroke-width="2"/>
  <path d="M335,216 V186 Q335,180 341,180 H559 Q565,180 565,186 V216 Z" fill="#fbeef0" stroke="#9b1c31" stroke-width="2"/>
  <text x="450" y="205" text-anchor="middle" font-size="19" font-weight="bold" fill="#9b1c31">movie_actor</text>
  <g font-size="15" font-weight="bold">
    <text x="347" y="237" fill="#9b1c31">PK</text>
    <text x="375" y="237" fill="#2e7d32">FK</text>
    <text x="347" y="260" fill="#9b1c31">PK</text>
    <text x="375" y="260" fill="#2e7d32">FK</text>
  </g>
  <g font-family="Menlo, Consolas, 'Courier New', monospace" font-size="16" fill="#333">
    <text x="413" y="237">movie_id</text>
    <text x="413" y="260">actor_id</text>
    <text x="413" y="283">role</text>
  </g>

  <!-- table movie -->
  <rect x="650" y="180" width="230" height="113" rx="6" fill="#fff" stroke="#1b6ec2" stroke-width="2"/>
  <path d="M650,216 V186 Q650,180 656,180 H874 Q880,180 880,186 V216 Z" fill="#eef4fb" stroke="#1b6ec2" stroke-width="2"/>
  <text x="765" y="205" text-anchor="middle" font-size="19" font-weight="bold" fill="#1b6ec2">movie</text>
  <g font-size="15" font-weight="bold">
    <text x="662" y="237" fill="#9b1c31">PK</text>
  </g>
  <g font-family="Menlo, Consolas, 'Courier New', monospace" font-size="16" fill="#333">
    <text x="706" y="237">movie_id</text>
    <text x="706" y="260">title</text>
    <text x="706" y="283">year</text>
  </g>

  <g stroke="#333" stroke-width="2.5">
    <line x1="250" y1="254.5" x2="335" y2="254.5"/>
    <line x1="565" y1="231.5" x2="650" y2="231.5"/>
    <use href="#one-and-only-one" transform="translate(250,254.5) scale(-1,1)"/>
    <use href="#zero-or-many" transform="translate(335,254.5)"/>
    <use href="#zero-or-many" transform="translate(565,231.5) scale(-1,1)"/>
    <use href="#one-and-only-one" transform="translate(650,231.5)"/>
  </g>
</svg>
